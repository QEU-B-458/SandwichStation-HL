name: Publish Station Axiom Beta

concurrency:
  group: publish-beta

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 9.0.x

      - name: Get Engine Tag
        run: |
          cd RobustToolbox
          git fetch --depth=1

      - name: Override NuGet package source mapping
        run: |
          cat > NuGet.Config << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Install dependencies
        run: dotnet restore Content.Packaging Content.Client/Content.Client.csproj Content.Server/Content.Server.csproj

      - name: Build Packaging Tool
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package client (windows-x64)
        run: |
          dotnet run --project Content.Packaging -- client --platform windows-x64
          mkdir -p /tmp/artifacts
          find release/ -name "SS14.Client*.zip" -exec cp {} /tmp/artifacts/SS14.Client_windows-x64.zip \;

      - name: Package server (linux-x64)
        run: |
          dotnet run --project Content.Packaging -- server --platform linux-x64
          mkdir -p /tmp/artifacts
          find release/ -name "SS14.Server*.zip" -exec cp {} /tmp/artifacts/SS14.Server_linux-x64.zip \;

      - name: Prepare Release Directory and Bundle ACZ
        run: |
          rm -rf release
          mkdir -p release
          cp /tmp/artifacts/SS14.Client_windows-x64.zip release/
          mkdir -p /tmp/server_bundle
          unzip /tmp/artifacts/SS14.Server_linux-x64.zip -d /tmp/server_bundle/
          cp /tmp/artifacts/SS14.Client_windows-x64.zip /tmp/server_bundle/Content.Client.zip
          cd /tmp/server_bundle
          zip -r $GITHUB_WORKSPACE/release/SS14.Server_linux-x64.zip .
          cd $GITHUB_WORKSPACE

      - name: Set version
        id: version
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "beta-build-${VERSION}" \
            --title "Beta Build ${VERSION}" \
            --notes "Automated beta build $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "release/SS14.Server_linux-x64.zip" \
            "release/SS14.Client_windows-x64.zip"

      - name: Update manifest-beta.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: python3 Tools/update_manifest_beta.py

      - name: Commit updated manifest
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add manifest-beta.json
          git diff --staged --quiet || git commit -m "chore: update beta manifest [skip ci]"
          git push
