# Resomi species - raptor-like avians with ammonia-based blood
- type: species
  id: Resomi
  name: species-name-resomi
  roundStart: true
  prototype: MobResomi
  dollPrototype: AppearanceResomi
  defaultSkinTone: "#faf7f7"
  skinColoration: Hues
  sprites: ResomiSprites
  maleFirstNames: NamesResomiMale
  femaleFirstNames: NamesResomiFemale
  naming: First
  sexes:
  - Unsexed
  - Male
  - Female
  markingData:
    Torso:
      group: Resomi
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Resomi
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Resomi
      layers: [LArm]
    ArmRight:
      group: Resomi
      layers: [RArm]
    HandLeft:
      group: Resomi
      layers: [LHand]
    HandRight:
      group: Resomi
      layers: [RHand]
    LegLeft:
      group: Resomi
      layers: [LLeg]
    LegRight:
      group: Resomi
      layers: [RLeg]
    FootLeft:
      group: Resomi
      layers: [LFoot]
    FootRight:
      group: Resomi
      layers: [RFoot]

