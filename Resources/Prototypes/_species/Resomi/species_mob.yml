# Resomi mob entity
- type: entity
  parent:
  - AppearanceResomi
  - BaseSpeciesMobOrganic
  id: MobResomi
  name: Urist McRaptor
  components:
  - type: JumpAbility
    action: ActionResomiGravityJump
    canCollide: true
    jumpDistance: 3.5
    jumpSound:
      path: /Audio/_species/Resomi/Effects/resomi.ogg
      params:
        pitch: 1.33
        volume: -5
        variation: 0.05
  - type: Puller
    needsHands: false
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatLizard
      amount: 5
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: DamageVisuals
    thresholds: [ 10, 30, 50, 70 ]
    damageOverlayGroups:
      Brute:
        sprite: _species/Resomi/Mobs/Effects/Resomi/brute_damage.rsi
        color: "#C048C2"
      Burn:
        sprite: _species/Resomi/Mobs/Effects/Resomi/burn_damage.rsi
  - type: FireVisuals
    sprite: _species/Resomi/Mobs/Effects/onfire.rsi
    normalState: Resomi_minor_burning
    alternateState: Resomi_burning
  - type: Speech
    speechVerb: Parrot
    speechSounds: UnisexResomi
    allowedEmotes: ['Chirp', 'Hiss', 'Purr', 'Growl', 'Trill', 'Scree', 'Call', 'Squawk']
  - type: Vocal
    sounds:
      Male: UnisexResomi
      Unsexed: UnisexResomi
      Female: UnisexResomi
  - type: TypingIndicator
    proto: resomi
  - type: NightVision
  - type: Bloodstream
    bloodReagent: AmmoniaBlood
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Resomi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          FoodMeatChickenFriedMystery:
            min: 2
            max: 4
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    coldDamageThreshold: 195.4
    heatDamageThreshold: 320.15
    coldDamage:
      types:
        Cold: 0.05
    heatDamage:
      types:
        Heat: 3
  - type: MovementSpeedModifier
    weightlessAcceleration: 2.5
  - type: NpcFactionMember
    factions:
    - NanoTrasen
