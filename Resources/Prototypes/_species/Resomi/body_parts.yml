# Resomi body part entities. Uses Resomi-specific parts RSI.

- type: entity
  id: PartResomi
  parent: BasePart
  name: "resomi body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Resomi/Mobs/Species/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: AmmoniaBlood
        Quantity: 10

- type: entity
  id: TorsoResomi
  name: "resomi torso"
  parent: [PartResomi, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Resomi/Mobs/Species/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: ResomiChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: AmmoniaBlood
        Quantity: 20

