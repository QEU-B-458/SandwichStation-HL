# Resomi external organ entities
- type: entity
  parent: OrganBase
  id: OrganResomi
  abstract: true
  suffix: resomi

- type: entity
  parent: OrganResomi
  id: OrganResomiExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Resomi/Mobs/Species/Resomi/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _species/Resomi/Mobs/Species/Resomi/parts.rsi
  - type: VisualOrganMarkings
