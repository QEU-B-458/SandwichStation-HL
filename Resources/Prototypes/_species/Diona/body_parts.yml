# Diona body part entities.

- type: entity
  id: PartDiona
  parent: BasePart
  name: "diona body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Diona/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Sap
        Quantity: 10

- type: entity
  id: TorsoDiona
  name: "diona torso"
  parent: [PartDiona, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Diona/parts.rsi
    state: torso
  - type: BodyPart
    baseLayerId: DionaChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Sap
        Quantity: 20

