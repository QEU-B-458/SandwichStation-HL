# Vox sprite layer definitions.
# Vox uses Mobs/Species/Vox/parts.rsi — non-sexed (Unsexed only species).

- type: humanoidBaseSprite
  id: VoxChest
  baseSprite:
    sprite: Mobs/Species/Vox/parts.rsi
    state: torso
  matchSkin: true

- type: humanoidBaseSprite
  id: VoxHead
  baseSprite:
