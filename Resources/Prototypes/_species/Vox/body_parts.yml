# Vox body part entities.

- type: entity
  id: PartVox
  parent: BasePart
  name: "vox body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Vox/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 10

# Non-sexed torso — set baseLayerId directly
- type: entity
  id: TorsoVox
  name: "vox torso"
  parent: [PartVox, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Vox/parts.rsi
    state: torso
  - type: BodyPart
    baseLayerId: VoxChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: AmmoniaBlood
        Quantity: 30

