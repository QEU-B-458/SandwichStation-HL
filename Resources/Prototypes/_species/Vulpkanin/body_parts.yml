# Vulpkanin body part entities.

- type: entity
  id: PartVulpkanin
  parent: BasePart
  name: "vulpkanin body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Vulpkanin/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: SulfurBlood
        Quantity: 10

# Sexed torso — baseLayerId set; GetSexMorph appends Male/Female at render time
- type: entity
  id: TorsoVulpkanin
  name: "vulpkanin torso"
  parent: [PartVulpkanin, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Vulpkanin/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: VulpkaninChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: SulfurBlood
        Quantity: 30

# Non-sexed head — explicit baseLayerId
- type: entity
  id: HeadVulpkanin
  name: "vulpkanin head"
  parent: [PartVulpkanin, BaseHead]
  categories: [ HideSpawnMenu ]
