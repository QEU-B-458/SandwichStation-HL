    sprite: Mobs/Species/Vulpkanin/parts.rsi
    state: head
  - type: BodyPart
    baseLayerId: VulpkaninHead
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: SulfurBlood
        Quantity: 15

