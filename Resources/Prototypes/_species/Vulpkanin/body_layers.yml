# Vulpkanin sprite layer definitions.
# Vulpkanin uses Mobs/Species/Vulpkanin/parts.rsi — sexed torso, non-sexed head.

# Sexed torso layers
- type: humanoidBaseSprite
  id: VulpkaninChest
  baseSprite:
    sprite: Mobs/Species/Vulpkanin/parts.rsi
    state: torso_m
  matchSkin: true

- type: humanoidBaseSprite
  id: VulpkaninChestMale
  baseSprite:
    sprite: Mobs/Species/Vulpkanin/parts.rsi
    state: torso_m
  matchSkin: true

- type: humanoidBaseSprite
  id: VulpkaninChestFemale
  baseSprite:
    sprite: Mobs/Species/Vulpkanin/parts.rsi
    state: torso_f
  matchSkin: true

