# Vulpkanin body prototype and organ entities.

- type: body
  id: Vulpkanin
  name: "vulpkanin"
  root: torso
  slots:
    head:
      part: HeadVulpkanin
      connections:
      - torso
      organs:
        brain: OrganVulpkaninBrain
        eyes: OrganVulpkaninEyes
        tongue: OrganVulpkaninTongue
        ears: OrganVulpkaninEars
        appendix: OrganVulpkaninAppendix
    torso:
      part: TorsoVulpkanin
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganVulpkaninHeart
        lungs: OrganVulpkaninLungs
        stomach: OrganVulpkaninStomach
        liver: OrganVulpkaninLiver
        kidneys: OrganVulpkaninKidneys
    right arm:
      part: RightArmVulpkanin
      connections:
      - right hand
    left arm:
      part: LeftArmVulpkanin
      connections:
      - left hand
    right hand:
      part: RightHandVulpkanin
    left hand:
      part: LeftHandVulpkanin
    right leg:
      part: RightLegVulpkanin
      connections:
      - right foot
    left leg:
      part: LeftLegVulpkanin
      connections:
      - left foot
    right foot:
      part: RightFootVulpkanin
    left foot:
      part: LeftFootVulpkanin

# Vulpkanin organ abstract chain
- type: entity
  parent: OrganBase
  id: OrganVulpkanin
  abstract: true
  suffix: vulpkanin

- type: entity
  id: OrganVulpkaninMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Animal ]

- type: entity
  parent: OrganVulpkanin
  id: OrganVulpkaninInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Vulpkanin/organs.rsi

- type: entity
  id: OrganVulpkaninVisual
  abstract: true

- type: entity
  parent: [ OrganVulpkanin, OrganVulpkaninVisual ]
  id: OrganVulpkaninExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Vulpkanin/parts.rsi

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganVulpkaninExternal ]
  id: OrganVulpkaninTorso

- type: entity
  parent: [ OrganBaseHead, OrganVulpkaninExternal ]
  id: OrganVulpkaninHead

- type: entity
  parent: [ OrganBaseArmLeft, OrganVulpkaninExternal ]
  id: OrganVulpkaninArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganVulpkaninExternal ]
  id: OrganVulpkaninArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganVulpkaninExternal ]
  id: OrganVulpkaninHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganVulpkaninExternal ]
  id: OrganVulpkaninHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganVulpkaninExternal ]
  id: OrganVulpkaninLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganVulpkaninExternal ]
  id: OrganVulpkaninLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganVulpkaninExternal ]
  id: OrganVulpkaninFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganVulpkaninExternal ]
  id: OrganVulpkaninFootRight

- type: entity
  parent: [ OrganBaseBrain, OrganSpriteHumanInternal, OrganVulpkaninInternal ]
