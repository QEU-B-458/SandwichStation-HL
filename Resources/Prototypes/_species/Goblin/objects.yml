  parent: [ NFBaseGoblinMadeTools, FlashlightLantern ]
  name: glimmer
  description: An improvised lantern. How is it possible to put a power cell and a light bulb inside a glass bottle without breaking either of those items?
  components:
  - type: Sprite
    sprite: _species/Goblin/Objects/Tools/goblin_tools/lantern.rsi
    layers:
    - state: lantern
    - state: lantern-overlay
      shader: unshaded
      visible: false
      map: [ "light" ]
    - sprite: _species/Goblin/Objects/Tools/goblin_tools/overlay_sparks.rsi
      state: overlay-icon
      shader: unshaded
  - type: Item
    sprite: _species/Goblin/Objects/Tools/goblin_tools/lantern.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      - sprite: _species/Goblin/Objects/Tools/goblin_tools/overlay_sparks.rsi
        state: overlay-inhand-left
        shader: unshaded
      right:
      - state: inhand-right
      - sprite: _species/Goblin/Objects/Tools/goblin_tools/overlay_sparks.rsi
        state: overlay-inhand-right
        shader: unshaded
    storedRotation: 0
  - type: Clothing
    sprite: _species/Goblin/Objects/Tools/goblin_tools/lantern.rsi
  - type: PointLight
    enabled: false
    mask: null
    radius: 4
    energy: 2.5
    color: "#FFC458"
    netsync: false
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: NFGoblinMadePowerCell
  - type: Construction
    graph: NFGoblinMadeRemoteSignaller
    node: NFGoblinMadeRemoteSignaller
# endregion

#region power cell
- type: entity
  id: NFGoblinMadePowerCell
  parent: [ NFBaseGoblinMadeTools, PowerCellSmall ]
  name: power cell
  description: An improvised power cell. How long will you be able to resist the temptation to drink the electrolyte?
  suffix: Goblin Made, Full
  components:
  - type: Sprite
    sprite: _species/Goblin/Objects/Tools/goblin_tools/power_cell.rsi
    layers:
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o2
      color: "#0084ff"
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: icon
    - sprite: _species/Goblin/Objects/Tools/goblin_tools/overlay_sparks.rsi
      state: overlay-icon
      shader: unshaded
  - type: Item
    sprite: _species/Goblin/Objects/Tools/goblin_tools/power_cell.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      - sprite: _species/Goblin/Objects/Tools/goblin_tools/overlay_sparks.rsi
        state: overlay-inhand-left
        shader: unshaded
      right:
      - state: inhand-right
      - sprite: _species/Goblin/Objects/Tools/goblin_tools/overlay_sparks.rsi
        state: overlay-inhand-right
        shader: unshaded
  - type: Clothing
    sprite: _species/Goblin/Objects/Tools/goblin_tools/power_cell.rsi
  # MachinePart component removed: does not exist in ss14-rebase

- type: entity
  id: NFGoblinMadePowerCellDepleted
  parent: NFGoblinMadePowerCell
  suffix: Goblin Made, Empty
  components:
  - type: Battery
    maxCharge: 360
    startingCharge: 0
  - type: Construction
    graph: NFGoblinMadePowerCellDepleted
    node: NFGoblinMadePowerCellDepleted
