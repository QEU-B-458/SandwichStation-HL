- type: species
  id: Goblin
  name: species-name-goblin
  roundStart: true
  prototype: MobGoblin
  dollPrototype: AppearanceGoblin
  skinColoration: HumanToned
  maleFirstNames: NamesGoblinFirstMale
  femaleFirstNames: NamesGoblinFirstFemale
  lastNames: NamesGoblinLast

- type: markingsGroup
  parent: Undergarments
  id: Goblin
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ GoblinEarsBasic ]
    enum.HumanoidVisualLayers.Snout:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

# Goblin appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceGoblin
  name: goblin appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganGoblinTorso
      Head: OrganGoblinHead
      ArmLeft: OrganGoblinArmLeft
      ArmRight: OrganGoblinArmRight
      HandRight: OrganGoblinHandRight
      HandLeft: OrganGoblinHandLeft
      LegLeft: OrganGoblinLegLeft
      LegRight: OrganGoblinLegRight
      FootLeft: OrganGoblinFootLeft
      FootRight: OrganGoblinFootRight
      Brain: OrganGoblinBrain
      Eyes: OrganGoblinEyes
      Lungs: OrganGoblinLungs
      Heart: OrganGoblinHeart
      Stomach: OrganGoblinStomach
      Liver: OrganGoblinLiver
      Kidneys: OrganGoblinKidneys
      Tongue: OrganGoblinTongue
      Appendix: OrganGoblinAppendix
      Ears: OrganGoblinEars
  - type: HumanoidProfile
    species: Goblin

# Goblin mob entity
- type: entity
  parent:
  - AppearanceGoblin
  - BaseSpeciesMobOrganic
  id: MobGoblin
  name: Urist McGoblin
  components:
  - type: Sprite
    scale: 0.7, 0.7
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 300
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Speech
    speechVerb: Goblin
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 5
  # TODO: Add Goblin-specific components (GoblinMade, crafting, etc.)

