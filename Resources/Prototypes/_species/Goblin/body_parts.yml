# Goblin body part entities.

- type: entity
  id: PartGoblin
  parent: BasePart
  name: "goblin body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Goblin/Mobs/Species/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 1.5
      - ReagentId: UncookedAnimalProteins
        Quantity: 1.5
      - ReagentId: Blood
        Quantity: 5

- type: entity
  id: TorsoGoblin
  name: "goblin torso"
  parent: [PartGoblin, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Goblin/Mobs/Species/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: GoblinChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

