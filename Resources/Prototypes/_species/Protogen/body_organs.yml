# Protogen body prototype — owns the full part + organ tree.

- type: body
  id: Protogen
  name: "protogen"
  root: torso
  slots:
    head:
      part: HeadProtogen
      connections:
      - torso
      organs:
        brain: OrganProtogenBrain
        eyes: OrganProtogenEyes
        tongue: OrganProtogenTongue
        ears: OrganProtogenEars
    torso:
      part: TorsoProtogen
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganProtogenHeart
        lungs: OrganProtogenLungs
        stomach: OrganProtogenStomach
        liver: OrganProtogenLiver
        kidneys: OrganProtogenKidneys
        appendix: OrganProtogenAppendix
    right arm:
      part: RightArmProtogen
      connections:
      - right hand
    left arm:
      part: LeftArmProtogen
      connections:
      - left hand
    right hand:
      part: RightHandProtogen
    left hand:
      part: LeftHandProtogen
    right leg:
      part: RightLegProtogen
      connections:
      - right foot
    left leg:
      part: LeftLegProtogen
      connections:
      - left foot
    right foot:
      part: RightFootProtogen
    left foot:
      part: LeftFootProtogen

# Protogen organs — custom sprites and rich descriptions preserved from original file

- type: entity
  id: BaseProtogenOrganUnGibbable
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
  - type: Organ
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: FlavorProfile
    flavors:
    - people
  - type: Tag
    tags:
    - Meat

- type: entity
  id: BaseProtogenOrgan
  parent: BaseProtogenOrganUnGibbable
  abstract: true
  components:
  - type: GibbableOrgan

- type: entity
  id: OrganProtogenBrain
  parent: BaseProtogenOrganUnGibbable
  name: brain
  description: "The source of incredible, unending intelligence. 01001000 01101111 01101110 01101011 00101110"
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    state: brain
  - type: Organ
    slotId: brain
  - type: Input
    context: "ghost"
  - type: Brain
  - type: InputMover
  - type: Examiner
  - type: BlockMovement
  - type: BadFood
  - type: Tag
    tags:
    - Meat
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 5
        reagents:
        - ReagentId: GreyMatter
          Quantity: 5
  - type: FlavorProfile
    flavors:
    - people
  - type: FoodSequenceElement
    entries:
      Burger: Brain
      Taco: Brain
  - type: Item
    size: Small
    heldPrefix: brain

- type: entity
  id: OrganProtogenEyes
  parent: BaseProtogenOrgan
  name: eyes
  description: "Emits LED lights to resemble eyes."
  categories: [ HideSpawnMenu ]
  components:
  - type: Organ
    slotId: eyes
    category: Eyes
  - type: Eyes
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    layers:
    - state: eyeball-l
    - state: eyeball-r
  - type: Item
    size: Small
    heldPrefix: eyeballs

- type: entity
  id: OrganProtogenTongue
  parent: BaseProtogenOrgan
  name: tongue
  description: "A fleshy muscle located within a Protogen's mouth, wherever that is."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    state: tongue

- type: entity
  id: OrganProtogenAppendix
  parent: BaseProtogenOrgan
  name: appendix
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    layers:
    - state: appendix
    - state: appendix-inflamed
      visible: false

- type: entity
  id: OrganProtogenEars
  parent: BaseProtogenOrgan
  name: ears
  description: "Lets a Protogen process audio. And listen to their favorite techno hits."
  categories: [ HideSpawnMenu ]
  components:
  - type: Organ
    category: Ears
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    state: ears
  - type: Ears

- type: entity
  id: OrganProtogenLungs
  parent: BaseProtogenOrgan
  name: lungs
  description: "Filters oxygen from an atmosphere, which is then sent into the bloodstream to be used as an electron carrier. God knows how a Protogen breathes at all."
  categories: [ HideSpawnMenu ]
  components:
  - type: Organ
    slotId: lungs
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    layers:
    - state: lung-l
    - state: lung-r
  - type: Item
    size: Small
    heldPrefix: lungs
  - type: Lung
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Human ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      Lung:
        maxVol: 100.0
        canReact: false
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  id: OrganProtogenHeart
  parent: BaseProtogenOrgan
  name: heart
  description: "Even the most stone-cold, technology-based heart was alive once."
  categories: [ HideSpawnMenu ]
  components:
  - type: Organ
    slotId: heart
    category: Heart
  - type: Heart
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    state: heart-on
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Human]
    groups:
    - id: Medicine
    - id: Cryogenic
    - id: Poison
    - id: Narcotic
  - type: Item
    size: Small
    heldPrefix: heart

- type: entity
  id: OrganProtogenStomach
  parent: BaseProtogenOrgan
  name: stomach
  description: "Gross. This is hard to stomach."
  categories: [ HideSpawnMenu ]
  components:
  - type: Organ
    slotId: stomach
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [Animal]
    groups:
    - id: Food
    - id: Drink

- type: entity
  id: OrganProtogenLiver
  parent: BaseProtogenOrgan
  name: liver
  description: "Pairing suggestion: fermented RAM sticks and CPU drives."
  categories: [ HideSpawnMenu ]
  components:
  - type: Organ
    slotId: liver
    category: Liver
  - type: Liver
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    state: liver
  - type: Item
    size: Small
    heldPrefix: liver
  - type: Metabolizer
    maxReagents: 1
    metabolizerTypes: [Human]
    groups:
    - id: Alcohol
      rateModifier: 0.1

- type: entity
  id: OrganProtogenKidneys
  parent: BaseProtogenOrgan
  name: kidneys
  description: "Filters toxins and computer viruses from the bloodstream."
  categories: [ HideSpawnMenu ]
  components:
  - type: Organ
    slotId: kidneys
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/Protogen/organs.rsi
    layers:
    - state: kidney-l
    - state: kidney-r
  - type: Item
    size: Small
    heldPrefix: kidneys
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [Human]
    removeEmpty: true
