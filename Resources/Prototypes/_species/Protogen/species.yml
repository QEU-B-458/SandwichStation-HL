# Protogen species - cybernetic-organic hybrids with visor faces
- type: species
  id: Protogen
  name: species-name-protogen
  roundStart: true
  prototype: MobProtogen
  dollPrototype: AppearanceProtogen
  defaultSkinTone: "#ffda93"
  skinColoration: Hues
  sprites: ProtogenSprites
  maleFirstNames: names_protogen_first_male
  femaleFirstNames: names_protogen_first_female
  naming: First
  markingData:
    Torso:
      group: Protogen
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Protogen
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Protogen
      layers: [LArm]
    ArmRight:
      group: Protogen
      layers: [RArm]
    HandLeft:
      group: Protogen
      layers: [LHand]
    HandRight:
      group: Protogen
      layers: [RHand]
    LegLeft:
      group: Protogen
      layers: [LLeg]
    LegRight:
      group: Protogen
      layers: [RLeg]
    FootLeft:
      group: Protogen
      layers: [LFoot]
    FootRight:
      group: Protogen
      layers: [RFoot]

- type: markingsGroup
  parent: Undergarments
  id: Protogen
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ ProtogenVisor ]
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ ProtogenTail ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ ProtogenEars ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
