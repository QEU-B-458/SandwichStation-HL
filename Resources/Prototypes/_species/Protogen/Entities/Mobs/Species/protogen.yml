# Protogen appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceProtogen
  name: protogen appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _species/Protogen/Mobs/Species/Protogen/displacement.rsi
            state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OrganProtogenTorso
      Head: OrganProtogenHead
      ArmLeft: OrganProtogenArmLeft
      ArmRight: OrganProtogenArmRight
      HandRight: OrganProtogenHandRight
      HandLeft: OrganProtogenHandLeft
      LegLeft: OrganProtogenLegLeft
      LegRight: OrganProtogenLegRight
      FootLeft: OrganProtogenFootLeft
      FootRight: OrganProtogenFootRight
      Brain: OrganProtogenBrain
      Eyes: OrganProtogenEyes
      Heart: OrganProtogenHeart
      Lungs: OrganProtogenLungs
      Stomach: OrganProtogenStomach
      Liver: OrganProtogenLiver
      Kidneys: OrganProtogenKidneys
  - type: HumanoidProfile
    species: Protogen

# Protogen mob entity
- type: entity
  parent:
  - AppearanceProtogen
  - BaseSpeciesMobOrganic
  id: MobProtogen
  name: Urist McHardDrive
  components:
  - type: HarpySinger
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Daw": { 0: 0 }
  - type: UserInterface
    interfaces:
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Protogen
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  # Carriable component removed: no C# type
  - type: Speech
    allowedEmotes: ['Belch', 'Beep', 'Ping', 'Buzz']
    speechSounds: Pai
  - type: Vocal
    wilhelm: "/Audio/_species/IPC/Voice/wilhelm.ogg"
    sounds:
      Male: UnisexIPC
      Female: UnisexIPC
      Unsexed: UnisexIPC
  - type: TypingIndicator
    proto: robot
  - type: Deathgasp
    prototype: SiliconDeathgasp
    needsCritical: false
  - type: Respirator
    damage:
      types:
        Asphyxiation: 0.25
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: NpcFactionMember
    factions:
    - NanoTrasen
