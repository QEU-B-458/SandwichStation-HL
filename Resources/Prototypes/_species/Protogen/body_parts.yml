# Protogen body part entities. Uses Protogen-specific parts RSI.

- type: entity
  id: PartProtogen
  parent: BasePart
  name: "protogen body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/parts.rsi
  - type: StaticPrice
    price: 25
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoProtogen
  name: "protogen torso"
  parent: [PartProtogen, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Protogen/Mobs/Species/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: ProtogenChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

