# Skrell external organ entities
- type: entity
  parent: OrganBase
  id: OrganSkrell
  abstract: true
  suffix: skrell

- type: entity
  parent: OrganSkrell
  id: OrganSkrellExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Skrell/Mobs/Skrells/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _species/Skrell/Mobs/Skrells/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Skrell

# Torso
- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganSkrellExternal ]
  id: OrganSkrellTorso
  components:
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

# Head
- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganSkrellExternal ]
  id: OrganSkrellHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

# Limbs
- type: entity
  parent: [ OrganBaseArmLeft, OrganSkrellExternal ]
  id: OrganSkrellArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganSkrellExternal ]
  id: OrganSkrellArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganSkrellExternal ]
  id: OrganSkrellHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganSkrellExternal ]
  id: OrganSkrellHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganSkrellExternal ]
  id: OrganSkrellLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganSkrellExternal ]
  id: OrganSkrellLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganSkrellExternal ]
  id: OrganSkrellFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganSkrellExternal ]
  id: OrganSkrellFootRight
