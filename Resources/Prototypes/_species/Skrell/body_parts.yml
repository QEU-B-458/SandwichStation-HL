# Skrell body part entities.
# Each part is referenced by ID from body_organs.yml (the body prototype).

- type: entity
  id: PartSkrell
  parent: BasePart
  name: "skrell body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Skrell/Mobs/Skrells/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoSkrell
  name: "skrell torso"
  parent: [PartSkrell, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Skrell/Mobs/Skrells/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: SkrellChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
