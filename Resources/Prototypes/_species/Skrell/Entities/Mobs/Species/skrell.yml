# Skrell appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceSkrell
  name: skrell appearance
  components:
  - type: Inventory
    speciesId: skrell
  - type: InitialBody
    organs:
      Torso: OrganSkrellTorso
      Head: OrganSkrellHead
      ArmLeft: OrganSkrellArmLeft
      ArmRight: OrganSkrellArmRight
      HandRight: OrganSkrellHandRight
      HandLeft: OrganSkrellHandLeft
      LegLeft: OrganSkrellLegLeft
      LegRight: OrganSkrellLegRight
      FootLeft: OrganSkrellFootLeft
      FootRight: OrganSkrellFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Lungs: OrganHumanLungs
      Heart: OrganAnimalHeart
      Stomach: OrganHumanStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Skrell

# Skrell mob entity
- type: entity
  parent:
  - AppearanceSkrell
  - BaseSpeciesMobOrganic
  id: MobSkrell
  name: Urist R McFrog
  components:
  - type: TemperatureDamage
    heatDamageThreshold: 335
    coldDamageThreshold: 223
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 250
    sweatHeatRegulation: 500
    shiveringHeatRegulation: 500
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Thirst
    baseDecayRate: 0.2
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2.0
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.15
  - type: Damageable
    damageModifierSet: Skrell
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#1d2cbf"
  - type: TypingIndicator
    proto: feroxi
  - type: Speech
    speechVerb: Skrell
    allowedEmotes: [ 'RMCSkrellPeep', 'RMCSkrellAnger', 'Trill', 'RMCSkrellWarble' ]
  - type: Vocal
    sounds:
      Male: RMCMaleSkrell
      Unsexed: RMCFemaleSkrell
      Female: RMCFemaleSkrell
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
