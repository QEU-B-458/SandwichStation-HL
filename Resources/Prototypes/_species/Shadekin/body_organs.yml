# Shadekin body prototype — owns the full part + organ tree.
# Shadekin are shadow beings with a unique ethereal core organ.

- type: body
  id: Shadekin
  name: "shadekin"
  root: torso
  slots:
    head:
      part: HeadShadekin
      connections:
      - torso
      organs:
        brain: OrganShadekinBrain
        eyes: OrganShadekinEyes
    torso:
      part: TorsoShadekin
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganShadekinHeart
        lungs: OrganShadekinLungs
        stomach: OrganShadekinStomach
        liver: OrganShadekinLiver
        kidneys: OrganShadekinKidneys
        core: OrganShadekinCore
    right arm:
      part: RightArmShadekin
      connections:
      - right hand
    left arm:
      part: LeftArmShadekin
      connections:
      - left hand
    right hand:
      part: RightHandShadekin
    left hand:
      part: LeftHandShadekin
    right leg:
      part: RightLegShadekin
      connections:
      - right foot
    left leg:
      part: LeftLegShadekin
      connections:
      - left foot
    right foot:
      part: RightFootShadekin
    left foot:
      part: LeftFootShadekin

# Species-specific organs — preserved from Body/Organs/shadekin.yml

- type: entity
  id: OrganShadekinBrain
  parent: OrganHumanBrain
  name: brain
  suffix: Shadekin
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganShadekinEyes
  parent: OrganHumanEyes
  name: eyes
  suffix: Shadekin
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganShadekinLungs
  parent: OrganHumanLungs
  name: lungs
  suffix: Shadekin
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganShadekinHeart
  parent: OrganHumanHeart
  name: heart
  suffix: Shadekin
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganShadekinStomach
  parent: OrganHumanStomach
  name: stomach
  suffix: Shadekin
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganShadekinLiver
  parent: OrganHumanLiver
  name: liver
  suffix: Shadekin
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganShadekinKidneys
  parent: OrganHumanKidneys
  name: kidneys
  suffix: Shadekin
  categories: [ HideSpawnMenu ]

# Shadekin-specific core organ — contains ShadekinEssence, unique to this species
- type: entity
  parent: OrganBase
  id: OrganShadekinCore
  name: shadekin core
  suffix: shadekin core
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Shadekin/Mobs/Species/organs.rsi
    state: core
  - type: SolutionContainerManager
    solutions:
      organ:
        maxVol: 5
        reagents:
        - ReagentId: ShadekinEssence
          Quantity: 5
