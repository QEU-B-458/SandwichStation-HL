- type: entity
  id: NullPhaseAction
  parent: BaseToggleAction
  name: Phase Shift
  description: Shift yourself out of alignment with realspace to travel quickly to different areas.
  categories: [HideSpawnMenu]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: false
    icon:
      sprite: _species/Shadekin/Interface/Actions/shadekin.rsi
      state: phase
    iconOn:
      sprite: _species/Shadekin/Interface/Actions/shadekin.rsi
      state: phase
  - type: InstantAction
    event: !type:ToggleActionEvent
