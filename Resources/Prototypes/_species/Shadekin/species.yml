# Shadekin species - shadow beings with ethereal abilities
- type: species
  id: Shadekin
  name: species-name-shadekin
  roundStart: true
  prototype: MobShadekin
  dollPrototype: AppearanceShadekin
  skinColoration: Hues
  defaultSkinTone: "#ffffff"
  eyeColoration: Shadekin
  sprites: ShadekinSprites
  maleFirstNames: names_shadekin
  femaleFirstNames: names_shadekin
  naming: First
  minAge: 18
  maxAge: 300
  youngAge: 50
  oldAge: 250
  markingData:
    Torso:
      group: Shadekin
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Shadekin
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Shadekin
      layers: [LArm]
    ArmRight:
      group: Shadekin
      layers: [RArm]
    HandLeft:
      group: Shadekin
      layers: [LHand]
    HandRight:
      group: Shadekin
      layers: [RHand]
    LegLeft:
      group: Shadekin
      layers: [LLeg]
    LegRight:
      group: Shadekin
      layers: [RLeg]
    FootLeft:
      group: Shadekin
      layers: [LFoot]
    FootRight:
      group: Shadekin
      layers: [RFoot]

- type: markingsGroup
  parent: Undergarments
  id: Shadekin
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ TailShadekin ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ EarsShadekin ]
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
