- type: entity
  name: Shadekin Haze
  id: ShadekinShadow
  parent: BaseShadow
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Appearance
  - type: Transform
    anchored: true
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_species/Shadekin/Effects/nullphase.ogg
  - type: TimedDespawn
    lifetime: 30
  - type: Physics
    canCollide: false
  - type: Occluder
  - type: Sprite
    drawdepth: Effects
    sprite: Effects/spookysmoke.rsi
    layers:
    - state: spookysmoke
      color: "#793a80dd"
      map: [base]
  - type: Tag
    tags:
    - HideContextMenu
    - SpookyFog
  - type: OptionsVisualizer
    visuals:
      base:
      - options: Default
        data: { state: spookysmoke }
      - options: ReducedMotion
        data: { state: spookysmoke_static }

- type: entity
  id: ShadekinPhaseInEffect
  name: Shadekin Phase In
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_species/Shadekin/Effects/shadekinphase.ogg
  - type: TimedDespawn
    lifetime: 0.5
  - type: Sprite
    layers:
    - sprite: _species/Shadekin/Effects/shadekin.rsi
      state: tp_in
      shader: unshaded
    netsync: false
    drawdepth: Effects

- type: entity
  id: ShadekinPhaseOutEffect
  name: Shadekin Phase Out
  components:
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_species/Shadekin/Effects/shadekinphase.ogg
  - type: TimedDespawn
    lifetime: 0.5
  - type: Sprite
    layers:
    - sprite: _species/Shadekin/Effects/shadekin.rsi
      state: tp_out
      shader: unshaded
    netsync: false
    drawdepth: Effects

- type: entity
  id: EffectNightVision
  categories: [ HideSpawnMenu ]
  name: night vision
  components:
  - type: PointLight
    color: "#D6E4FF"
    energy: 0.8
    radius: 20
    softness: 20
