# Shadekin body part entities. Uses Shadekin-specific parts RSI.

- type: entity
  id: PartShadekin
  parent: BasePart
  name: "shadekin body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Shadekin/Mobs/Species/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoShadekin
  name: "shadekin torso"
  parent: [PartShadekin, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Shadekin/Mobs/Species/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: ShadekinChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

