# Shadekin appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceShadekin
  name: shadekin appearance
  components:
  - type: Inventory
    speciesId: shadekin
    templateId: human
  - type: HumanoidProfile
    species: Shadekin

# Shadekin mob entity — shadow beings with phase-shift and null-space abilities
- type: entity
  parent:
  - AppearanceShadekin
  - BaseSpeciesMobOrganic
  id: MobShadekin
  name: Urist McShadow
  components:
  - type: Sprite
    scale: 0.9, 0.9
  - type: Actions
  - type: Shadekin
  - type: NullPhase
  - type: NullSpace
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.85
        Heat: 0.1
  - type: Speech
    allowedEmotes: ["Marr", "Wurble", "Hiss", "Purr"]
  - type: Vocal
    sounds:
      Male: MaleShadekin
      Female: FemaleShadekin
      Unsexed: MaleShadekin
  - type: TypingIndicator
    proto: shadekin
  - type: PassiveDamage
    allowedStates:
    - Alive
    damageCap: 20
    damage:
      types:
        Heat: -0.07
      groups:
        Brute: -0.07
  - type: Flammable
    damage:
      types:
        Heat: 1.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior {}
      - !type:SpawnEntitiesBehavior
        spawn:
          ShadekinShadow:
            min: 1
            max: 1
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
          ShadekinShadow:
            min: 1
            max: 1
      - !type:BurnBodyBehavior {}
  - type: Temperature
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    currentTemperature: 310.15
    specificHeat: 42
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.0
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 1
    bloodlossHealDamage:
      types:
        Bloodloss: -0.25
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Shadekin
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 5
