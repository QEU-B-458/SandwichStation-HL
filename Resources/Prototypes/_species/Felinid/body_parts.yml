# Felinid body part entities.
# Uses Human RSI sprites — own part IDs for future customizability.

- type: entity
  id: PartFelinid
  parent: BasePart
  name: "felinid body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoFelinid
  name: "felinid torso"
  parent: [PartFelinid, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: FelinidChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

