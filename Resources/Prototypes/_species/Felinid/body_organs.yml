# Felinid body prototype — owns the full part + organ tree.
# Felinid uses Felinid body parts and organs — they are biologically human with cat features.

- type: body
  id: Felinid
  name: "felinid"
  root: torso
  slots:
    head:
      part: HeadFelinid
      connections:
      - torso
      organs:
        brain: OrganFelinidBrain
        eyes: OrganFelinidEyes
        tongue: OrganFelinidTongue
        ears: OrganFelinidEars
    torso:
      part: TorsoFelinid
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganFelinidHeart
        lungs: OrganFelinidLungs
        stomach: OrganFelinidStomach
        liver: OrganFelinidLiver
        kidneys: OrganFelinidKidneys
        appendix: OrganFelinidAppendix
    right arm:
      part: RightArmFelinid
      connections:
      - right hand
    left arm:
      part: LeftArmFelinid
      connections:
      - left hand
    right hand:
      part: RightHandFelinid
    left hand:
      part: LeftHandFelinid
    right leg:
      part: RightLegFelinid
      connections:
      - right foot
    left leg:
      part: LeftLegFelinid
      connections:
      - left foot
    right foot:
      part: RightFootFelinid
    left foot:
      part: LeftFootFelinid

# Species-specific organs — parented from human equivalents for customizability

- type: entity
  id: OrganFelinidBrain
  parent: OrganHumanBrain
  name: brain
  suffix: Felinid
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganFelinidEyes
  parent: OrganHumanEyes
  name: eyes
  suffix: Felinid
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganFelinidTongue
