  name: tongue
  suffix: Felinid
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganFelinidEars
  parent: OrganHumanEars
  name: ears
  suffix: Felinid
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganFelinidHeart
  parent: OrganHumanHeart
  name: heart
  suffix: Felinid
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganFelinidLungs
  parent: OrganHumanLungs
  name: lungs
  suffix: Felinid
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganFelinidStomach
  parent: OrganHumanStomach
  name: stomach
  suffix: Felinid
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganFelinidLiver
  parent: OrganHumanLiver
  name: liver
  suffix: Felinid
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganFelinidKidneys
  parent: OrganHumanKidneys
  name: kidneys
