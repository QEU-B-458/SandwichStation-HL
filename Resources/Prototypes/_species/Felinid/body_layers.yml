# Felinid sprite layer definitions.
# Uses Human RSI — Felinids are biologically human with cat features.
# Own IDs for future customizability (custom sprites can be swapped in later).

- type: humanoidBaseSprite
  id: FelinidChest
  baseSprite:
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m
  matchSkin: true

- type: humanoidBaseSprite
  id: FelinidHead
