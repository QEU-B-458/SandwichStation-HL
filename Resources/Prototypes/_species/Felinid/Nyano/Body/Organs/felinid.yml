# Felinid organs - inherit from human organs but use Felinid marking group

# Torso
- type: entity
  parent: OrganBaseTorsoSexed
  id: OrganFelinidTorso
  suffix: felinid
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Felinid
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

