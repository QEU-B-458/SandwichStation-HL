# Felinid appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFelinid
  name: felinid appearance
  components:
  - type: Inventory
    speciesId: felinid
  - type: HumanoidProfile
    species: Felinid

# Felinid mob entity
- type: entity
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  id: MobFelinid
  name: Urist McFelinid
  components:
  - type: Body
    prototype: Felinid
  - type: Sprite
    scale: 0.8, 0.8
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.28
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.85
      80: 0.75
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 4
        Piercing: 1
  - type: Speech
    speechVerb: Felinid
    speechSounds: Alto
    allowedEmotes:
    - Hiss
    - Meow
    - Mew
    - Growl
    - Purr
    - Trill
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 1
  - type: Stamina
  - type: TypingIndicator
    proto: felinid
  # PseudoItem component removed: no C# type
  - type: Vocal
    wilhelm: "/Audio/_species/Felinid/Voice/cat_wilhelm.ogg"
    sounds:
      Male: MaleFelinid
      Female: FemaleFelinid
      Unsexed: MaleFelinid
  - type: Felinid
  - type: NpcFactionMember
    factions:
    - NanoTrasen
    - Felinid
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPie
    - reagents: [ Water ]
      methods: [ Touch ]
      effects:
      - !type:Emote
        emote: Scream
        probability: 0.2
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
