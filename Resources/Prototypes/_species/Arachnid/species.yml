# Arachnid species - arthropod humanoids
- type: species
  id: Arachnid
  name: species-name-arachnid
  roundStart: true
  prototype: MobArachnid
  dollPrototype: AppearanceArachnid
  defaultSkinTone: "#385878"
  skinColoration: Hues
  sprites: ArachnidSprites
  maleFirstNames: NamesArachnidFirst
  femaleFirstNames: NamesArachnidFirst
  lastNames: NamesArachnidLast
  sexes:
  - Unsexed
  markingData:
    Torso:
      group: Arachnid
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Arachnid
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Arachnid
      layers: [LArm]
    ArmRight:
      group: Arachnid
      layers: [RArm]
    HandLeft:
      group: Arachnid
      layers: [LHand]
    HandRight:
      group: Arachnid
      layers: [RHand]
    LegLeft:
      group: Arachnid
      layers: [LLeg]
    LegRight:
      group: Arachnid
      layers: [RLeg]
    FootLeft:
      group: Arachnid
      layers: [LFoot]
    FootRight:
      group: Arachnid
      layers: [RFoot]

- type: markingsGroup
  parent: Undergarments
  id: Arachnid
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ ArachnidAppendagesDefault ]
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ ArachnidCheliceraeDownwards ]
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
