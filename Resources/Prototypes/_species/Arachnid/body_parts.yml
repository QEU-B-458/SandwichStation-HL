# Arachnid body part entities.

- type: entity
  id: PartArachnid
  parent: BasePart
  name: "arachnid body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Arachnid/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: CopperBlood
        Quantity: 10

- type: entity
  id: TorsoArachnid
  name: "arachnid torso"
  parent: [PartArachnid, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Arachnid/parts.rsi
    state: torso
  - type: BodyPart
    baseLayerId: ArachnidChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: CopperBlood
        Quantity: 20

