- type: species
  id: Thaven
  name: species-name-thaven
  roundStart: true
  prototype: MobThaven
  dollPrototype: AppearanceThaven
  skinColoration: Hues
  defaultSkinTone: "#ffffff"
  sprites: ThavenSprites
  maleFirstNames: NamesThaven
  femaleFirstNames: NamesThaven
  naming: First
  sexes:
  - Male
  - Female
  - Unsexed
  markingData:
    Torso:
      group: Thaven
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Thaven
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Thaven
      layers: [LArm]
    ArmRight:
      group: Thaven
      layers: [RArm]
    HandLeft:
      group: Thaven
      layers: [LHand]
    HandRight:
      group: Thaven
      layers: [RHand]
    LegLeft:
      group: Thaven
      layers: [LLeg]
    LegRight:
      group: Thaven
      layers: [RLeg]
    FootLeft:
      group: Thaven
      layers: [LFoot]
    FootRight:
      group: Thaven
      layers: [RFoot]

- type: markingsGroup
  parent: Undergarments
  id: Thaven
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ ThavenEars1 ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Overlay:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 5
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
