# Thaven body part entities.
# Each part is referenced by ID from body_organs.yml (the body prototype).

- type: entity
  id: PartThaven
  parent: BasePart
  name: "thaven body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Thaven/Mobs/Species/Thaven/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoThaven
  name: "thaven torso"
  parent: [PartThaven, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Thaven/Mobs/Species/Thaven/parts.rsi
    state: torso
  - type: BodyPart
    baseLayerId: ThavenChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
