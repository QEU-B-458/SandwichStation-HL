# IPC body part entities. Non-organic — oil-based extractable.

- type: entity
  id: PartIPC
  parent: BasePart
  name: "ipc body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/IPC/Mobs/Species/parts.rsi
  - type: StaticPrice
    price: 50
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Oil
        Quantity: 5

- type: entity
  id: TorsoIPC
  name: "ipc chassis torso"
  parent: [PartIPC, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/IPC/Mobs/Species/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: IPCChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Oil
        Quantity: 15

