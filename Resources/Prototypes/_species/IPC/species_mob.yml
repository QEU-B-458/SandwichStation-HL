# IPC appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceIPC
  name: ipc appearance
  components:
  - type: Inventory
    speciesId: ipc
    templateId: ipc
  - type: HumanoidProfile
    species: IPC

# IPC mob entity (non-organic: uses BaseSpeciesMob, not BaseSpeciesMobOrganic)
- type: entity
  parent:
  - AppearanceIPC
  - MobBloodstream
  - MobAtmosExposed
  - MobFlammable
  - BaseSpeciesMob
  id: MobIPC
  name: Urist McPositronic
  description: A positronic brain in a metal body.
  components:
  - type: Sprite
  - type: Icon
    sprite: _species/IPC/Mobs/Species/parts.rsi
    state: full
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: true
  - type: ItemSlots
    slots:
      cell_slot:
        locked: true
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  # BatterySlotRequiresLock removed: no C# type
  # EncryptionHolderRequiresLock removed: no C# type
  # SiliconEmitSoundOnDrained removed: no C# type
  - type: Lock
    locked: true
    lockOnClick: false
    unlockOnClick: false
    lockTime: 5
    unlockTime: 5
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  # LayingDown component removed: no C# type
  - type: MobThresholds
    thresholds:
      0: Alive
      119.999: Critical
      120: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
  - type: TypingIndicator
    proto: robot
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTypeTrigger
          damageType: Blunt
          damage: 400
        behaviors:
          - !type:GibBehavior { }
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.7
      90: 0.5
      120: 0.3
  # SiliconDownOnDead removed: no C# type
  # Silicon removed: no C# type
  # BatteryDrinker removed: no C# type
  # DeadStartupButton removed: no C# type
  # EmitBuzzWhileDamaged removed: no C# type
  # WeldingHealable removed: no C# type
  - type: Damageable
    damageModifierSet: IPC
    damageContainer: Inorganic
  - type: GuideHelp
    guides:
    - IPC
  - type: EncryptionKeyHolder
    keySlots: 10
    examineWhileLocked: false
    preserveExistingChannels: true
    intrinsicChannels:
    - Binary
  - type: ActiveRadio
    intrinsicChannels:
    - Binary
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    intrinsicChannels:
    - Binary
  - type: CanHostGuardian
  - type: WiresPanel
    openingTool: Operating
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: Bloodstream
    bloodReagent: Oil
    bloodRefreshAmount: 0.0
  - type: Unrevivable
    cloneable: false
    analyzable: false
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 475
    coldDamageThreshold: 55
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 5
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
  - type: Vocal
    sounds:
      Male: UnisexSilicon
      Female: UnisexSilicon
      Unsexed: UnisexSilicon
  - type: ZombieImmune
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#808080"
