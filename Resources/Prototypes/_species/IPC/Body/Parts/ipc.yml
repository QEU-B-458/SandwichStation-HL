# IPC external organ entities
- type: entity
  parent: OrganBase
  id: OrganIPC
  abstract: true
  suffix: ipc

- type: entity
  parent: OrganIPC
  id: OrganIPCExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _species/IPC/Mobs/Species/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _species/IPC/Mobs/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: IPC

# Torso
- type: entity
  parent: [ OrganBaseTorso, OrganIPCExternal ]
  id: OrganIPCTorso
  components:
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - UndergarmentTop
      - UndergarmentBottom

# Head
- type: entity
  parent: [ OrganBaseHead, OrganIPCExternal ]
  id: OrganIPCHead

# Limbs
- type: entity
  parent: [ OrganBaseArmLeft, OrganIPCExternal ]
  id: OrganIPCArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganIPCExternal ]
  id: OrganIPCArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganIPCExternal ]
  id: OrganIPCHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganIPCExternal ]
  id: OrganIPCHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganIPCExternal ]
  id: OrganIPCLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganIPCExternal ]
  id: OrganIPCLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganIPCExternal ]
  id: OrganIPCFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganIPCExternal ]
  id: OrganIPCFootRight
