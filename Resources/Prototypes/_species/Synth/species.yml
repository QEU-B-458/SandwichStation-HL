# Synth species - synthetic humanoids
- type: species
  id: Synth
  name: species-name-synth
  roundStart: true
  prototype: MobSynth
  dollPrototype: AppearanceSynth
  defaultSkinTone: "#34a223"
  skinColoration: Hues
  sprites: SynthSprites
  markingData:
    Torso:
      group: Synth
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Synth
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Synth
      layers: [LArm]
    ArmRight:
      group: Synth
      layers: [RArm]
    HandLeft:
      group: Synth
      layers: [LHand]
    HandRight:
      group: Synth
      layers: [RHand]
    LegLeft:
      group: Synth
      layers: [LLeg]
    LegRight:
      group: Synth
      layers: [RLeg]
    FootLeft:
      group: Synth
      layers: [LFoot]
    FootRight:
      group: Synth
      layers: [RFoot]

- type: markingsGroup
  parent: Undergarments
  id: Synth
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ SynthVisor ]
    enum.HumanoidVisualLayers.Tail:
      limit: 2
      required: true
      default: [ SynthTail ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 3
      required: true
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
