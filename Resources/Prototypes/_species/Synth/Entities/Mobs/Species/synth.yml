# Synth appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceSynth
  name: synth appearance
  components:
  - type: Inventory
    speciesId: synth
    displacements:
      head:
        sizeMaps:
          32:
            sprite: _species/Synth/Mobs/Species/displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: _species/Synth/Mobs/Species/displacement.rsi
            state: mask
      back:
        sizeMaps:
          32:
            sprite: _species/Synth/Mobs/Species/displacement.rsi
            state: back
      outerClothing:
        sizeMaps:
          32:
            sprite: _species/Synth/Mobs/Species/displacement.rsi
            state: outerclothing
      jumpsuit:
        sizeMaps:
          32:
            sprite: _species/Synth/Mobs/Species/displacement.rsi
            state: jumpsuit
      hand:
        sizeMaps:
          32:
            sprite: _species/Synth/Mobs/Species/displacement.rsi
            state: hand
      shoes:
        sizeMaps:
          32:
            sprite: _species/Synth/Mobs/Species/displacement.rsi
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganSynthTorso
      Head: OrganSynthHead
      ArmLeft: OrganSynthArmLeft
      ArmRight: OrganSynthArmRight
      HandRight: OrganSynthHandRight
      HandLeft: OrganSynthHandLeft
      LegLeft: OrganSynthLegLeft
      LegRight: OrganSynthLegRight
      FootLeft: OrganSynthFootLeft
      FootRight: OrganSynthFootRight
      Brain: SynthCCU
      Eyes: SynthCameraGimbal
      Heart: OrganSynthHeart
      Lungs: OrganSynthLungs
      Stomach: OrganSynthStomach
      Liver: OrganSynthLiver
      Kidneys: SynthEnergyCoil
  - type: HumanoidProfile
    species: Synth

# Synth mob entity (non-organic: uses BaseSpeciesMob, not BaseSpeciesMobOrganic)
- type: entity
  parent:
  - AppearanceSynth
  - MobBloodstream
  - MobAtmosExposed
  - MobFlammable
  - BaseSpeciesMob
  id: MobSynth
  name: Urist McSynth
  components:
  - type: Sprite
  - type: Icon
    sprite: _species/Synth/Mobs/Species/parts.rsi
    state: full
  - type: Damageable
    damageModifierSet: Synth
    damageContainer: Synth
  - type: HLSynth
  - type: Thirst
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#8afffd"
  - type: ZombieImmune
  - type: Puller
    needsHands: false
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcFist
    damage:
      types:
        Blunt: 8
  # Carriable component removed: no C# type
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Borg
    allowedEmotes: [ 'Thump', 'Purr', 'Beep', 'Ping', 'Buzz' ]
  - type: Vocal
    sounds:
      Male: UnisexSilicon
      Female: UnisexSilicon
      Unsexed: UnisexSilicon
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: WiresPanel
    openingTool: Operating
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: EncryptionKeyHolder
    keySlots: 10
    examineWhileLocked: false
    preserveExistingChannels: true
    intrinsicChannels:
    - Binary
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    intrinsicChannels:
    - Binary
  - type: ActiveRadio
    intrinsicChannels:
    - Binary
  - type: Bloodstream
    bloodReagent: InertNanites
    bloodRefreshAmount: 0.0
  - type: Unrevivable
    cloneable: false
    analyzable: false
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 475
    coldDamageThreshold: 55
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.3
  - type: TemperatureSpeed
    thresholds:
      100: 0.7
      75: 0.4
      55: 0.2
  - type: NpcFactionMember
    factions:
    - NanoTrasen
