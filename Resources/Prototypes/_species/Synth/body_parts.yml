# Synth body part entities.
# Each part is referenced by ID from body_organs.yml (the body prototype).

- type: entity
  id: PartSynth
  parent: BasePart
  name: "synth body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/parts.rsi
  - type: StaticPrice
    price: 30
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nanites
        Quantity: 5

- type: entity
  id: TorsoSynth
  name: "synth torso"
  parent: [PartSynth, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: SynthChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Nanites
        Quantity: 15

