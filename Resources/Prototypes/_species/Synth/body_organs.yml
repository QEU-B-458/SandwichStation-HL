# Synth body prototype and internal organ entities.
# Organ entities are defined in the original Body/Organs/synth.yml and preserved here.

- type: body
  id: Synth
  name: "synth"
  root: torso
  slots:
    head:
      part: HeadSynth
      connections:
      - torso
      organs:
        brain: SynthCCU
        eyes: SynthCameraGimbal
        ears: SynthAudioPack
        tongue: OrganSynthTongue
        appendix: SynthRedBrick
    torso:
      part: TorsoSynth
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganSynthHeart
        lungs: OrganSynthLungs
        stomach: OrganSynthStomach
        liver: OrganSynthLiver
        kidneys: SynthEnergyCoil
    right arm:
      part: RightArmSynth
      connections:
      - right hand
    left arm:
      part: LeftArmSynth
      connections:
      - left hand
    right hand:
      part: RightHandSynth
    left hand:
      part: LeftHandSynth
    right leg:
      part: RightLegSynth
      connections:
      - right foot
    left leg:
      part: LeftLegSynth
      connections:
      - left foot
    right foot:
      part: RightFootSynth
    left foot:
      part: LeftFootSynth

- type: entity
  id: BaseSynthOrganUnGibbable
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
  - type: Organ
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nanites
          Quantity: 5

- type: entity
  id: BaseSynthOrgan
  parent: BaseSynthOrganUnGibbable
  abstract: true
  components:
  - type: GibbableOrgan

- type: entity
  id: SynthCCU
  parent: BaseItem
  name: synth ccu
  description: "A Synth brain. You should really put it back."
  components:
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_ccu
    scale: 0.65, 0.65
  - type: Organ
    slotId: brain
  - type: Brain
  - type: BorgBrain
  - type: Input
    context: "ghost"
  - type: BlockMovement
  - type: Examiner
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechSounds: Pai
  - type: Alerts
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: Appearance
  - type: Tag
    tags:
    - CannotSuicide
  - type: Item
    size: Small
    heldPrefix: synth ccu

- type: entity
  id: SynthCameraGimbal
  parent: BaseItem
  name: camera gimbal
  description: "A small mechanical gimbal featuring several multi-spectrum cameras. Maybe don't put it in anything other than a Synth."
  components:
  - type: Organ
    slotId: eyes
    category: Eyes
  - type: Eyes
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_camera_gimbal
    scale: 0.6, 0.6
  - type: Item
    size: Small
    heldPrefix: camera gimbal

- type: entity
  id: OrganSynthTongue
  parent: BaseSynthOrgan
  name: synth tongue
  description: "It's a fucking tongue. Why would you touch it?"
  components:
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_tongue

- type: entity
  id: SynthRedBrick
  parent: BaseItem
  name: red brick
  components:
  - type: Organ
    slotId: appendix
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_red_brick
    scale: 0.6, 0.6

- type: entity
  id: SynthAudioPack
  parent: BaseItem
  name: audio pack
  description: "A sensor pack designed to be installed in a Synth. This one contains audio sensors."
  components:
  - type: Organ
    slotId: ears
    category: Ears
  - type: Ears
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_audio_pack
    scale: 0.7, 0.7

- type: entity
  id: OrganSynthLungs
  parent: BaseSynthOrgan
  name: synth lungs
  description: "Synth lungs simulating organic functions for internal cooling. Not very interesting on their own."
  components:
  - type: Organ
    slotId: lungs
  - type: Lung
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_lungs
  - type: Item
    size: Small
    heldPrefix: synth lungs
  - type: Metabolizer
    stages: [ Respiration ]
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nanites
          Quantity: 5
      Lung:
        maxVol: 100.0
        canReact: false

- type: entity
  id: OrganSynthHeart
  parent: BaseSynthOrgan
  name: synth heart
  description: "A Synth heart. It doesn't do anything interesting yet."
  components:
  - type: Organ
    slotId: heart
    category: Heart
  - type: Heart
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_heart
    scale: 0.8, 0.8
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Synth ]
    stages: [ Bloodstream ]
  - type: Item
    size: Small
    heldPrefix: synth heart

- type: entity
  id: OrganSynthStomach
  parent: BaseSynthOrgan
  name: synth stomach
  description: "A Synth stomach. It can convert minerals to nutriment and nutriment to nanites."
  components:
  - type: Organ
    slotId: stomach
  - type: Stomach
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_stomach
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nanites
          Quantity: 5
      stomach:
        maxVol: 75
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Synth ]
    stages: [ Digestion ]
  - type: Item
    size: Small
    heldPrefix: synth stomach

- type: entity
  id: OrganSynthLiver
  parent: BaseSynthOrgan
  name: synth liver
  description: "A Synth liver. It prevents poisoning from alcohol and can convert ethanol to nutriment."
  components:
  - type: Organ
    slotId: liver
    category: Liver
  - type: Liver
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_liver
    scale: 0.9, 0.9
  - type: Item
    size: Small
    heldPrefix: synth liver
  - type: Metabolizer
    maxReagents: 1
    metabolizerTypes: [ Synth ]
    stages: [ Metabolites ]

- type: entity
  id: SynthEnergyCoil
  parent: BaseItem
  name: energy coil
  description: "A Synth energy coil. It doesn't seem to do anything interesting yet."
  components:
  - type: Organ
    slotId: kidneys
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/organs.rsi
    state: synth_energy_coil
    scale: 1.1, 1.1
  - type: Item
    size: Small
    heldPrefix: energy coil
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Synth ]
    removeEmpty: true
