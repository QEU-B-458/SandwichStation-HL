# Synth external organ entities
- type: entity
  parent: OrganBase
  id: OrganSynth
  abstract: true
  suffix: synth

- type: entity
  parent: OrganSynth
  id: OrganSynthExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Synth/Mobs/Species/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _species/Synth/Mobs/Species/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Synth

# Torso
- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganSynthExternal ]
  id: OrganSynthTorso
  components:
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - Tail
      - UndergarmentTop
      - UndergarmentBottom

# Head
- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganSynthExternal ]
  id: OrganSynthHead

# Limbs
- type: entity
  parent: [ OrganBaseArmLeft, OrganSynthExternal ]
  id: OrganSynthArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganSynthExternal ]
  id: OrganSynthArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganSynthExternal ]
  id: OrganSynthHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganSynthExternal ]
  id: OrganSynthHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganSynthExternal ]
  id: OrganSynthLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganSynthExternal ]
  id: OrganSynthLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganSynthExternal ]
  id: OrganSynthFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganSynthExternal ]
  id: OrganSynthFootRight
