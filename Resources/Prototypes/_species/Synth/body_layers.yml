# Synth sprite layer definitions.
# Synth have their own parts RSI at _species/Synth/Mobs/Species/parts.rsi.

- type: humanoidBaseSprite
  id: SynthChest
  baseSprite:
    sprite: _species/Synth/Mobs/Species/parts.rsi
    state: torso_m
  matchSkin: true

