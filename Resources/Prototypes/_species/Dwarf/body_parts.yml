# Dwarf body part entities.

- type: entity
  id: PartDwarf
  parent: BasePart
  name: "dwarf body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

# Sexed parts — baseLayerId set; GetSexMorph appends Male/Female at render time
- type: entity
  id: TorsoDwarf
  name: "dwarf torso"
  parent: [PartDwarf, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: DwarfChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadDwarf
  name: "dwarf head"
  parent: [PartDwarf, BaseHead]
  categories: [ HideSpawnMenu ]
  components:
