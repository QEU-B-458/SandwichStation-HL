# Dwarf species — short stocky humanoids, uses Human RSI with own body parts
- type: species
  id: Dwarf
  name: species-name-dwarf
  roundStart: true
  prototype: MobDwarf
  dollPrototype: AppearanceDwarf
  skinColoration: HumanToned
  sprites: DwarfSprites
  markingData:
    Torso:
      group: Dwarf
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Dwarf
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Dwarf
      layers: [LArm]
    ArmRight:
      group: Dwarf
      layers: [RArm]
    HandLeft:
      group: Dwarf
      layers: [LHand]
    HandRight:
      group: Dwarf
      layers: [RHand]
    LegLeft:
      group: Dwarf
      layers: [LLeg]
    LegRight:
      group: Dwarf
      layers: [RLeg]
    FootLeft:
      group: Dwarf
      layers: [LFoot]
    FootRight:
      group: Dwarf
      layers: [RFoot]

# Dwarf markings group — same visual layers as Human
- type: markingsGroup
  parent: Undergarments
  id: Dwarf
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Special:
      limit: 0
      required: false
