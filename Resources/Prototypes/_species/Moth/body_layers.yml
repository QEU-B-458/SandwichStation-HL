# Moth sprite layer definitions.
# Moth uses Mobs/Species/Moth/parts.rsi — sexed torso, non-sexed head, has eyes state.

# Sexed torso layers
- type: humanoidBaseSprite
  id: MothChest
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: torso_m
  matchSkin: true

- type: humanoidBaseSprite
  id: MothChestMale
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: torso_m
  matchSkin: true

- type: humanoidBaseSprite
  id: MothChestFemale
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: torso_f
  matchSkin: true

# Non-sexed head layer
- type: humanoidBaseSprite
  id: MothHead
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: head
  matchSkin: true

# Non-sexed body layers
- type: humanoidBaseSprite
  id: MothLArm
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: l_arm
  matchSkin: true

- type: humanoidBaseSprite
  id: MothRArm
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: r_arm
  matchSkin: true

- type: humanoidBaseSprite
  id: MothLHand
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: l_hand
  matchSkin: true

- type: humanoidBaseSprite
  id: MothRHand
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: r_hand
  matchSkin: true

- type: humanoidBaseSprite
  id: MothLLeg
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: l_leg
  matchSkin: true

- type: humanoidBaseSprite
  id: MothRLeg
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: r_leg
  matchSkin: true

- type: humanoidBaseSprite
  id: MothLFoot
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: l_foot
  matchSkin: true

- type: humanoidBaseSprite
  id: MothRFoot
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: r_foot
  matchSkin: true

# Marking layers
- type: humanoidBaseSprite
  id: MothLayerEyes
  baseSprite:
    sprite: Mobs/Species/Moth/parts.rsi
    state: eyes
  matchSkin: false

- type: humanoidBaseSprite
  id: MothLayerHeadTop
  matchSkin: false

- type: humanoidBaseSprite
  id: MothLayerTail
  matchSkin: false

- type: speciesBaseSprites
  id: MothSprites
  sprites:
    Chest: MothChest
    Head: MothHead
    LArm: MothLArm
    RArm: MothRArm
    LHand: MothLHand
    RHand: MothRHand
    LLeg: MothLLeg
    RLeg: MothRLeg
    LFoot: MothLFoot
    RFoot: MothRFoot
    Eyes: MothLayerEyes
    HeadTop: MothLayerHeadTop
    Tail: MothLayerTail
