# Moth body part entities.

- type: entity
  id: PartMoth
  parent: BasePart
  name: "moth body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Moth/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: InsectBlood
        Quantity: 10

# Sexed torso — baseLayerId set; GetSexMorph appends Male/Female at render time
- type: entity
  id: TorsoMoth
  name: "moth torso"
  parent: [PartMoth, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Moth/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: MothChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: InsectBlood
        Quantity: 20

# Non-sexed head — explicit baseLayerId
- type: entity
  id: HeadMoth
  name: "moth head"
  parent: [PartMoth, BaseHead]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Moth/parts.rsi
    state: head
  - type: BodyPart
    baseLayerId: MothHead
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: InsectBlood
        Quantity: 10

