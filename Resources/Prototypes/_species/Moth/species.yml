# Moth species — fluffy insectoid humanoids
- type: species
  id: Moth
  name: species-name-moth
  roundStart: true
  prototype: MobMoth
  defaultSkinTone: "#ffda93"
  dollPrototype: AppearanceMoth
  skinColoration: Hues
  sprites: MothSprites
  maleFirstNames: NamesMothFirstMale
  femaleFirstNames: NamesMothFirstFemale
  lastNames: NamesMothLast
  markingData:
    Torso:
      group: Moth
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Moth
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Moth
      layers: [LArm]
    ArmRight:
      group: Moth
      layers: [RArm]
    HandLeft:
      group: Moth
      layers: [LHand]
    HandRight:
      group: Moth
      layers: [RHand]
    LegLeft:
      group: Moth
      layers: [LLeg]
    LegRight:
      group: Moth
      layers: [RLeg]
    FootLeft:
      group: Moth
      layers: [LFoot]
    FootRight:
      group: Moth
      layers: [RFoot]

# Moth markings group — wings required, no hair/facial hair, antennae required
- type: markingsGroup
  parent: Undergarments
  id: Moth
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ MothWingsDefault ]
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ MothAntennasDefault ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
