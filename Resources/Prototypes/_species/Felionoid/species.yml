# Felionoid species - cat-like humanoids with custom body
- type: species
  id: Felionoid
  name: species-name-felionoid
  roundStart: true
  prototype: MobFelionoid
  dollPrototype: AppearanceFelionoid
  sprites: MobFelionoidSprites
  skinColoration: Hues
  defaultSkinTone: "#666666"
  maleFirstNames: names_felionoid
  femaleFirstNames: names_felionoid
  naming: First
  markingData:
    Torso:
      group: Felionoid
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Felionoid
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Felionoid
      layers: [LArm]
    ArmRight:
      group: Felionoid
      layers: [RArm]
    HandLeft:
      group: Felionoid
      layers: [LHand]
    HandRight:
      group: Felionoid
      layers: [RHand]
    LegLeft:
      group: Felionoid
      layers: [LLeg]
    LegRight:
      group: Felionoid
      layers: [RLeg]
    FootLeft:
      group: Felionoid
      layers: [LFoot]
    FootRight:
      group: Felionoid
      layers: [RFoot]

- type: markingsGroup
  parent: Undergarments
  id: Felionoid
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ FelionoidTailAnimated ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
