# Felionoid body part entities.
# Each part is referenced by ID from body_organs.yml (the body prototype).

- type: entity
  id: PartFelionoid
  parent: BasePart
  name: "felionoid body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Felionoid/Mobs/Species/Felionoid/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 1.5
      - ReagentId: UncookedAnimalProteins
        Quantity: 1.5
      - ReagentId: Blood
        Quantity: 5

- type: entity
  id: TorsoFelionoid
  name: "felionoid torso"
  parent: [PartFelionoid, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Felionoid/Mobs/Species/Felionoid/parts.rsi
    state: torso
  - type: BodyPart
    baseLayerId: FelionoidChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

