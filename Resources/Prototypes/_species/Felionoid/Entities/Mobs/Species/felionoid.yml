# Felionoid appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFelionoid
  name: felionoid appearance
  components:
  - type: Inventory
    speciesId: felionoid
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _species/Felionoid/Mobs/Species/Felionoid/displacement.rsi
            state: jumpsuit
      eyes:
        sizeMaps:
          32:
            sprite: _species/Felionoid/Mobs/Species/Felionoid/displacement.rsi
            state: eyes
      gloves:
        sizeMaps:
          32:
            sprite: _species/Felionoid/Mobs/Species/Felionoid/displacement.rsi
            state: hand
      head:
        sizeMaps:
          32:
            sprite: _species/Felionoid/Mobs/Species/Felionoid/displacement.rsi
            state: head
      back:
        sizeMaps:
          32:
            sprite: _species/Felionoid/Mobs/Species/Felionoid/displacement.rsi
            state: back
      ears:
        sizeMaps:
          32:
            sprite: _species/Felionoid/Mobs/Species/Felionoid/displacement.rsi
            state: ears
      shoes:
        sizeMaps:
          32:
            sprite: _species/Felionoid/Mobs/Species/Felionoid/displacement.rsi
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganFelionoidTorso
      Head: OrganFelionoidHead
      ArmLeft: OrganFelionoidArmLeft
      ArmRight: OrganFelionoidArmRight
      HandRight: OrganFelionoidHandRight
      HandLeft: OrganFelionoidHandLeft
      LegLeft: OrganFelionoidLegLeft
      LegRight: OrganFelionoidLegRight
      FootLeft: OrganFelionoidFootLeft
      FootRight: OrganFelionoidFootRight
      Brain: OrganHumanBrain
      Eyes: OrganFelionoidEyes
      Tongue: OrganHumanTongue
      Lungs: OrganHumanLungs
      Heart: OrganAnimalHeart
      Stomach: OrganResomiStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Felionoid

# Felionoid mob entity
- type: entity
  parent:
  - AppearanceFelionoid
  - BaseSpeciesMobOrganic
  id: MobFelionoid
  name: Urist McFelionoid
  components:
  - type: Sprite
    scale: 0.8, 0.8
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 110
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Puller
    needsHands: false
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Vox
  - type: SlowOnDamage
    speedModifierThresholds:
      51: 0.7
      68: 0.5
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    attackRate: 2
    damage:
      types:
        Slash: 3
  - type: Speech
    speechVerb: Felionoid
    allowedEmotes: ['Mew', 'Hiss', 'Meow', 'Growl', 'Purr', 'Trill']
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 1
  - type: Stamina
  - type: TypingIndicator
    proto: felinid
  # PseudoItem component removed: no C# type
  - type: Vocal
    sounds:
      Male: MaleFelionoid
      Female: FemaleFelionoid
      Unsexed: MaleFelionoid
  - type: Felinid
  - type: NpcFactionMember
    factions:
    - NanoTrasen
    - Felinid
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
    reactions:
    - reagents: [ Water, SpaceCleaner ]
      methods: [ Touch ]
      effects:
      - !type:WashCreamPieReaction
      - !type:Emote
        emote: Hiss
        showInChat: false
  - type: OwOAccent
  - type: MobThresholds
    thresholds:
      0: Alive
      85: Critical
      170: Dead
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 3
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#7a8bf2"
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - Felionoid
