# Felionoid external organ entities
- type: entity
  parent: OrganBase
  id: OrganFelionoid
  abstract: true
  suffix: felionoid

- type: entity
  parent: OrganFelionoid
  id: OrganFelionoidExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Felionoid/Mobs/Species/Felionoid/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _species/Felionoid/Mobs/Species/Felionoid/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Felionoid

# Torso
- type: entity
  parent: [ OrganBaseTorso, OrganFelionoidExternal ]
  id: OrganFelionoidTorso
  components:
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

# Head
- type: entity
  parent: [ OrganBaseHead, OrganFelionoidExternal ]
  id: OrganFelionoidHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

# Limbs
- type: entity
  parent: [ OrganBaseArmLeft, OrganFelionoidExternal ]
  id: OrganFelionoidArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganFelionoidExternal ]
  id: OrganFelionoidArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganFelionoidExternal ]
  id: OrganFelionoidHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganFelionoidExternal ]
  id: OrganFelionoidHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganFelionoidExternal ]
  id: OrganFelionoidLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganFelionoidExternal ]
  id: OrganFelionoidLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganFelionoidExternal ]
  id: OrganFelionoidFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganFelionoidExternal ]
  id: OrganFelionoidFootRight
