# Chitinid body part entities.
# Each part is referenced by ID from body_organs.yml (the body prototype).

- type: entity
  id: PartChitinid
  parent: BasePart
  name: "chitinid body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Chitinid/Mobs/Species/Chitinid/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: InsectBlood
        Quantity: 10

- type: entity
  id: TorsoChitinid
  name: "chitinid torso"
  parent: [PartChitinid, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Chitinid/Mobs/Species/Chitinid/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: ChitinidChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: InsectBlood
        Quantity: 20

