# Chitinid appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceChitinid
  name: chitinid appearance
  components:
  - type: HumanoidProfile
    species: Chitinid

# Chitinid mob entity
- type: entity
  parent:
  - AppearanceChitinid
  - BaseSpeciesMobOrganic
  id: MobChitinid
  name: Urist McAnt
  components:
  - type: Hunger
    baseDecayRate: 0.0467
  - type: UnpoweredFlashlight
  - type: PointLight
    enabled: false
    radius: 3
    softness: 5
    color: "#2CFA1F"
    autoRot: true
  # Carriable component removed: no C# type
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Chitinid
  - type: Speech
    speechVerb: Chitinid
    allowedEmotes: ['Chitter', 'Click', 'Hiss']
  - type: MeleeWeapon
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Piercing: 5
  - type: TypingIndicator
    proto: Chitinid
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeat
      amount: 5
  - type: Bloodstream
    bloodReagent: InsectBlood
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#808A51"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Vocal
    sounds:
      Male: UnisexChitinid
      Female: UnisexChitinid
      Unsexed: UnisexChitinid
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.42
        density: 220
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: TemperatureDamage
    heatDamageThreshold: 320
    coldDamageThreshold: 230
    coldDamage:
      types:
        Cold: 1.25
    heatDamage:
      types:
        Heat: 1.0
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureSpeed
    thresholds:
      289: 0.6
      275: 0.4
      250: 0.3
  - type: Chitinid
  - type: NpcFactionMember
    factions:
    - NanoTrasen
