# Sheleg external organ entities
- type: entity
  parent: OrganBase
  id: OrganSheleg
  abstract: true
  suffix: sheleg

- type: entity
  parent: OrganSheleg
  id: OrganShelegExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Sheleg/Mobs/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _species/Sheleg/Mobs/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Sheleg

# Torso
- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganShelegExternal ]
  id: OrganShelegTorso
  components:
