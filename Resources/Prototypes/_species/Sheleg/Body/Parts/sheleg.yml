    markingData:
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

# Head
- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganShelegExternal ]
  id: OrganShelegHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

