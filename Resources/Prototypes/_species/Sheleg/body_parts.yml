# Sheleg body part entities. Uses Sheleg-specific parts RSI.

- type: entity
  id: PartSheleg
  parent: BasePart
  name: "sheleg body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Sheleg/Mobs/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Ice
        Quantity: 5
      - ReagentId: Cryoxadone
        Quantity: 3

- type: entity
  id: TorsoSheleg
  name: "sheleg torso"
  parent: [PartSheleg, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Sheleg/Mobs/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: ShelegChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Ice
        Quantity: 15
      - ReagentId: Cryoxadone
        Quantity: 10

