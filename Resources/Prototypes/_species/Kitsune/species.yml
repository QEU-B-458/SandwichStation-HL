# Kitsune species - fox-like humanoids using Human body
- type: species
  id: Kitsune
  name: species-name-kitsune
  roundStart: true
  prototype: MobKitsune
  dollPrototype: AppearanceKitsune
  skinColoration: Hues
  sprites: KitsuneSprites
  maleFirstNames: names_kitsune_first_male
  femaleFirstNames: names_kitsune_first_female
  naming: First

- type: markingsGroup
  parent: Undergarments
  id: Kitsune
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ KitsuneTailDefault ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ KitsuneEarsDefault ]
    enum.HumanoidVisualLayers.Chest:
      limit: 6
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
