# Kitsune organs - inherit from human organs but use Kitsune marking group

# Torso
- type: entity
  parent: OrganBaseTorsoSexed
  id: OrganKitsuneTorso
  suffix: kitsune
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Kitsune
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

# Head
- type: entity
