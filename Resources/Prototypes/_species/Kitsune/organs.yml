# Kitsune organs - inherit from human organs but use Kitsune marking group

# Torso
- type: entity
  parent: OrganHumanTorso
  id: OrganKitsuneTorso
  suffix: kitsune
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Kitsune
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

# Head
- type: entity
  parent: OrganHumanHead
  id: OrganKitsuneHead
  suffix: kitsune
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Kitsune
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

