# Kitsune body prototype — owns the full part + organ tree.
# Kitsune are fox-like humanoids with human body shape and biology.

- type: body
  id: Kitsune
  name: "kitsune"
  root: torso
  slots:
    head:
      part: HeadKitsune
      connections:
      - torso
      organs:
        brain: OrganKitsuneBrain
        eyes: OrganKitsuneEyes
        tongue: OrganKitsuneTongue
        ears: OrganKitsuneEars
    torso:
      part: TorsoKitsune
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganKitsuneHeart
        lungs: OrganKitsuneLungs
        stomach: OrganKitsuneStomach
        liver: OrganKitsuneLiver
        kidneys: OrganKitsuneKidneys
        appendix: OrganKitsuneAppendix
    right arm:
      part: RightArmKitsune
      connections:
      - right hand
    left arm:
      part: LeftArmKitsune
      connections:
      - left hand
    right hand:
      part: RightHandKitsune
    left hand:
      part: LeftHandKitsune
    right leg:
      part: RightLegKitsune
      connections:
      - right foot
    left leg:
      part: LeftLegKitsune
      connections:
      - left foot
    right foot:
      part: RightFootKitsune
    left foot:
      part: LeftFootKitsune

# Species-specific organs — parented from human equivalents for customizability

- type: entity
  id: OrganKitsuneBrain
  parent: OrganHumanBrain
  name: brain
  suffix: Kitsune
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganKitsuneEyes
  parent: OrganHumanEyes
  name: eyes
  suffix: Kitsune
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganKitsuneTongue
