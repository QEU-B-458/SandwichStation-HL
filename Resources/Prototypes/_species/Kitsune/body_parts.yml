# Kitsune body part entities. Uses Human RSI.

- type: entity
  id: PartKitsune
  parent: BasePart
  name: "kitsune body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: TorsoKitsune
  name: "kitsune torso"
  parent: [PartKitsune, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: KitsuneChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

