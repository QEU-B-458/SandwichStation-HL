# Kitsune appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceKitsune
  name: kitsune appearance
  components:
  - type: Inventory
    speciesId: kitsune
    templateId: human
  - type: HumanoidProfile
    species: Kitsune

# Kitsune mob entity
- type: entity
  parent:
  - AppearanceKitsune
  - BaseSpeciesMobOrganic
  id: MobKitsune
  name: Urist McKitsune
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 50
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Kitsune
    damageContainer: Biological
  - type: Speech
    speechSounds: Alto
    allowedEmotes: ['Growl', 'Squeak', 'Yip', 'Whine', 'Yap', 'Howl']
  - type: Vocal
    sounds:
      Male: MaleKitsune
      Female: FemaleKitsune
      Unsexed: MaleKitsune
  # Carriable component removed: no C# type
  - type: TypingIndicator
    proto: kitsune
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-soft-floofy-kitsune
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/fox_squeak.ogg
  - type: Kitsune
  - type: LightweightDrunk
    boozeStrengthMultiplier: 3
  # PseudoItem component removed: no C# type
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Items/hiss.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Heat: 5
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5

# Kitsune fox form entity — used when transformed
- type: entity
  name: Kitsune
  parent: [SimpleMobBase, StripableInventoryBase]
  id: MobKitsuneFox
  description: A Kitsune's fox form.
  components:
  - type: KitsuneFox
  - type: MovementSpeedModifier
    baseWalkSpeed: 4.5
    baseSprintSpeed: 6
  - type: Sprite
    sprite: _species/Kitsune/Mobs/Customization/foxform.rsi
    layers:
    - state: kitsune_fox_body
      map: ["enum.KitsuneColorVisuals.Layer"]
    - state: kitsune_fox_innerear
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: Damageable
    damageContainer: BiologicalMetaphysical
    damageModifierSet: KitsuneFox
  - type: Inventory
    speciesId: fox
    templateId: pet
  - type: DamageStateVisuals
    states:
      Alive:
        Base: fox
      Critical:
        Base: fox_dead
      Dead:
        Base: fox_dead
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 3
  - type: Bloodstream
    bloodMaxVolume: 100
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Heat: 8
  - type: Tag
    tags:
    - VimPilot
    - DoorBumpOpener
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: MindContainer
    showExamineInfo: true
