# Kitsune appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceKitsune
  name: kitsune appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganHumanTorso
      Head: OrganHumanHead
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Lungs: OrganHumanLungs
      Heart: OrganAnimalHeart
      Stomach: OrganHumanStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Kitsune

# Kitsune mob entity
- type: entity
  parent:
  - AppearanceKitsune
  - BaseSpeciesMobOrganic
  id: MobKitsune
  name: Urist McKitsune
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 50
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageModifierSet: Kitsune
  - type: Speech
    speechSounds: Alto
    allowedEmotes: ['Growl', 'Squeak', 'Yip', 'Whine', 'Yap', 'Howl']
  - type: Vocal
    sounds:
      Male: MaleKitsune
      Female: FemaleKitsune
      Unsexed: MaleKitsune
  # Carriable component removed: no C# type
  - type: TypingIndicator
    proto: kitsune
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-soft-floofy-kitsune
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/fox_squeak.ogg
  - type: Kitsune
  - type: LightweightDrunk
    boozeStrengthMultiplier: 3
  # PseudoItem component removed: no C# type
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Items/hiss.ogg
    animation: WeaponArcClaw
    damage:
      types:
        Heat: 5
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
