# Human body part entities.

- type: entity
  id: PartHuman
  parent: BasePart
  name: "human body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

# Sexed parts — no baseLayerId; runtime appends Male/Female suffix
- type: entity
  id: TorsoHuman
  name: "human torso"
  parent: [PartHuman, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadHuman
  name: "human head"
  parent: [PartHuman, BaseHead]
  categories: [ HideSpawnMenu ]
