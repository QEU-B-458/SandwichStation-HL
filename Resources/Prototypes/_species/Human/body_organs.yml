# Human body prototype
- type: body
  id: Human
  name: "human"
  root: torso
  slots:
    head:
      part: HeadHuman
      connections:
      - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganHumanEyes
        tongue: OrganHumanTongue
        ears: OrganHumanEars
    torso:
      part: TorsoHuman
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganHumanHeart
        lungs: OrganHumanLungs
        stomach: OrganHumanStomach
        liver: OrganHumanLiver
        kidneys: OrganHumanKidneys
        appendix: OrganHumanAppendix
    right arm:
      part: RightArmHuman
      connections:
      - right hand
    left arm:
      part: LeftArmHuman
      connections:
      - left hand
    right hand:
      part: RightHandHuman
    left hand:
      part: LeftHandHuman
    right leg:
      part: RightLegHuman
      connections:
      - right foot
    left leg:
      part: LeftLegHuman
      connections:
      - left foot
    right foot:
      part: RightFootHuman
    left foot:
      part: LeftFootHuman

# Human organ abstract chain
- type: entity
  parent: OrganBase
  id: OrganHuman
  abstract: true
  suffix: human

- type: entity
  id: OrganHumanMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Human ]

- type: entity
  parent: OrganHuman
  id: OrganHumanInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganHuman
  id: OrganHumanExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganHumanExternal ]
  id: OrganHumanTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganHumanExternal ]
  id: OrganHumanHead

- type: entity
  parent: [ OrganBaseArmLeft, OrganHumanExternal ]
  id: OrganHumanArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganHumanExternal ]
  id: OrganHumanArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganHumanExternal ]
  id: OrganHumanHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganHumanExternal ]
  id: OrganHumanHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganHumanExternal ]
  id: OrganHumanLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganHumanExternal ]
  id: OrganHumanLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganHumanExternal ]
  id: OrganHumanFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganHumanExternal ]
  id: OrganHumanFootRight

- type: entity
  parent: [ OrganBaseBrain, OrganHumanInternal ]
  id: OrganHumanBrain

- type: entity
  parent: [ OrganBaseEyes, OrganHumanInternal, OrganHumanExternal ]
  id: OrganHumanEyes

- type: entity
  parent: [ OrganBaseTongue, OrganHumanInternal ]
  id: OrganHumanTongue

- type: entity
  parent: [ OrganBaseAppendix, OrganHumanInternal ]
  id: OrganHumanAppendix

- type: entity
  parent: [ OrganBaseEars, OrganHumanInternal ]
  id: OrganHumanEars

- type: entity
  parent: [ OrganBaseLungs, OrganHumanInternal, OrganHumanMetabolizer ]
  id: OrganHumanLungs

- type: entity
  parent: [ OrganBaseHeart, OrganHumanInternal, OrganHumanMetabolizer ]
  id: OrganHumanHeart

- type: entity
  parent: [ OrganBaseStomach, OrganHumanInternal, OrganHumanMetabolizer ]
  id: OrganHumanStomach

- type: entity
  parent: [ OrganBaseLiver, OrganHumanInternal, OrganHumanMetabolizer ]
  id: OrganHumanLiver

- type: entity
  parent: [ OrganBaseKidneys, OrganHumanInternal, OrganHumanMetabolizer ]
  id: OrganHumanKidneys
