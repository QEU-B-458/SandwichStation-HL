# Oni organs - human body shape but Oni marking group

# Torso
- type: entity
  parent: OrganHumanTorso
  id: OrganOniTorso
  suffix: oni
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Oni
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

# Head
- type: entity
  parent: OrganHumanHead
  id: OrganOniHead
  suffix: oni
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Oni
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

