# Oni appearance entity (character editor doll + body definition)
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceOni
  name: oni appearance
  components:
  - type: InitialBody
    organs:
      Torso: OrganOniTorso
      Head: OrganOniHead
      ArmLeft: OrganOniArmLeft
      ArmRight: OrganOniArmRight
      HandRight: OrganOniHandRight
      HandLeft: OrganOniHandLeft
      LegLeft: OrganOniLegLeft
      LegRight: OrganOniLegRight
      FootLeft: OrganOniFootLeft
      FootRight: OrganOniFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Oni

# Oni mob entity
- type: entity
  parent:
  - AppearanceOni
  - BaseSpeciesMobOrganic
  id: MobOni
  name: Urist McOni
  components:
  - type: Speech
    speechSounds: Baritone
  - type: Sprite
    scale: 1.2, 1.2
  - type: Oni
    modifiers:
      coefficients:
        Blunt: 1.2
        Slash: 1.2
        Piercing: 1.2
        Asphyxiation: 1.2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.42
        density: 220
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Stamina
    critThreshold: 125
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
