# Oni species - large humanoids with horns using Human body shape
- type: species
  id: Oni
  name: species-name-oni
  roundStart: true
  prototype: MobOni
  dollPrototype: AppearanceOni
  skinColoration: Hues
  sprites: OniSprites
  maleFirstNames: names_oni_first_male
  femaleFirstNames: names_oni_first_female
  naming: First
  markingData:
    Torso:
      group: Oni
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Oni
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Oni
      layers: [LArm]
    ArmRight:
      group: Oni
      layers: [RArm]
    HandLeft:
      group: Oni
      layers: [LHand]
    HandRight:
      group: Oni
      layers: [RHand]
    LegLeft:
      group: Oni
      layers: [LLeg]
    LegRight:
      group: Oni
      layers: [RLeg]
    FootLeft:
      group: Oni
      layers: [LFoot]
    FootRight:
      group: Oni
      layers: [RFoot]

- type: markingsGroup
  parent: Undergarments
  id: Oni
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ OniHornSingleCurved ]
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
