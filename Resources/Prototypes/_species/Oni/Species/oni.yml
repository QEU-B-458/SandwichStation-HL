# Oni species - uses Human body with larger frame and horns
- type: species
  id: Oni
  name: species-name-oni
  roundStart: true
  prototype: MobOni
  dollPrototype: AppearanceOni
  skinColoration: Hues
  # TODO: Create Oni-specific localizedDataset name files
  # maleFirstNames: NamesOniMale
  # femaleFirstNames: NamesOniFemale
  # lastNames: NamesOniLocation
  # naming: LastNoFirst

- type: markingsGroup
  parent: Undergarments
  id: Oni
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ OniHornSingleCurved ]
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 4
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 2
      required: false
