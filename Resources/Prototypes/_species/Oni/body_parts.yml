# Oni body part entities. Uses Human RSI.

- type: entity
  id: PartOni
  parent: BasePart
  name: "oni body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 4
      - ReagentId: Blood
        Quantity: 15

- type: entity
  id: TorsoOni
  name: "oni torso"
  parent: [PartOni, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: OniChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 15
      - ReagentId: Blood
        Quantity: 30

