# Harpy body part entities.

- type: entity
  id: PartHarpy
  parent: BasePart
  name: "harpy body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Harpy/Mobs/Species/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 1.5
      - ReagentId: UncookedAnimalProteins
        Quantity: 1.5
      - ReagentId: Blood
        Quantity: 5

- type: entity
  id: TorsoHarpy
  name: "harpy torso"
  parent: [PartHarpy, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Harpy/Mobs/Species/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: HarpyChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

