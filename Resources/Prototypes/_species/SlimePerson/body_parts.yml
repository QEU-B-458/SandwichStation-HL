# SlimePerson body part entities.

- type: entity
  id: PartSlimePerson
  parent: BasePart
  name: "slime person body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Slime/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Slime
        Quantity: 10

# Sexed torso — no baseLayerId; runtime appends Male/Female suffix
- type: entity
  id: TorsoSlimePerson
  name: "slime person torso"
  parent: [PartSlimePerson, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Slime/parts.rsi
    state: torso_m
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Slime
        Quantity: 30

# Non-sexed head — explicit baseLayerId
- type: entity
  id: HeadSlimePerson
  name: "slime person head"
  parent: [PartSlimePerson, BaseHead]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Slime/parts.rsi
    state: head
  - type: BodyPart
    baseLayerId: SlimePersonHead
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Slime
        Quantity: 15

