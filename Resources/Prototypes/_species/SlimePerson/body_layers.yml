# SlimePerson sprite layer definitions.
# Slime uses Mobs/Species/Slime/parts.rsi — sexed torso, non-sexed head, no eyes state.

# Sexed torso layers
- type: humanoidBaseSprite
  id: SlimePersonChest
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: torso_m
  matchSkin: true

- type: humanoidBaseSprite
  id: SlimePersonChestMale
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: torso_m
  matchSkin: true

- type: humanoidBaseSprite
  id: SlimePersonChestFemale
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: torso_f
  matchSkin: true

# Non-sexed head layer
- type: humanoidBaseSprite
  id: SlimePersonHead
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: head
  matchSkin: true

# Non-sexed body layers
- type: humanoidBaseSprite
  id: SlimePersonLArm
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: l_arm
  matchSkin: true

- type: humanoidBaseSprite
  id: SlimePersonRArm
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: r_arm
  matchSkin: true

- type: humanoidBaseSprite
  id: SlimePersonLHand
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: l_hand
  matchSkin: true

- type: humanoidBaseSprite
  id: SlimePersonRHand
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: r_hand
  matchSkin: true

- type: humanoidBaseSprite
  id: SlimePersonLLeg
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: l_leg
  matchSkin: true

- type: humanoidBaseSprite
  id: SlimePersonRLeg
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: r_leg
  matchSkin: true

- type: humanoidBaseSprite
  id: SlimePersonLFoot
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: l_foot
  matchSkin: true

- type: humanoidBaseSprite
  id: SlimePersonRFoot
  baseSprite:
    sprite: Mobs/Species/Slime/parts.rsi
    state: r_foot
  matchSkin: true

# Marking layers (hair/facial hair match skin at 0.72 alpha per markingsGroup appearances)
- type: humanoidBaseSprite
  id: SlimePersonLayerHair
  matchSkin: false

- type: humanoidBaseSprite
  id: SlimePersonLayerFacialHair
  matchSkin: false

- type: speciesBaseSprites
  id: SlimePersonSprites
  sprites:
    Chest: SlimePersonChest
    Head: SlimePersonHead
    LArm: SlimePersonLArm
    RArm: SlimePersonRArm
    LHand: SlimePersonLHand
    RHand: SlimePersonRHand
    LLeg: SlimePersonLLeg
    RLeg: SlimePersonRLeg
    LFoot: SlimePersonLFoot
    RFoot: SlimePersonRFoot
