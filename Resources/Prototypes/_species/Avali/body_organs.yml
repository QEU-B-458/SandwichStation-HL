# Avali body prototype — owns the full part + organ tree.
# Species-specific organ entities follow below.

- type: body
  id: Avali
  name: "avali"
  root: torso
  slots:
    head:
      part: HeadAvali
      connections:
      - torso
      organs:
        brain: OrganAvaliBrain
        eyes: OrganAvaliEyes
    torso:
      part: TorsoAvali
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganAvaliHeart
        lungs: OrganAvaliLungs
        stomach: OrganAvaliStomach
        liver: OrganAvaliLiver
        kidneys: OrganAvaliKidneys
    right arm:
      part: RightArmAvali
      connections:
      - right hand
    left arm:
      part: LeftArmAvali
      connections:
      - left hand
    right hand:
      part: RightHandAvali
    left hand:
      part: LeftHandAvali
    right leg:
      part: RightLegAvali
      connections:
      - right foot
    left leg:
      part: LeftLegAvali
      connections:
      - left foot
    right foot:
      part: RightFootAvali
    left foot:
      part: LeftFootAvali

# Species-specific organs

- type: entity
  id: OrganAvaliBrain
  parent: OrganHumanBrain
  name: brain
  suffix: Avali
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganAvaliEyes
  parent: OrganHumanEyes
  name: eyes
  suffix: Avali
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganAvaliStomach
  parent: OrganAnimalStomach
  categories: [ HideSpawnMenu ]
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - Meat
      - Pill
      - Crayon
      - Paper
      - AvianFood
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5

- type: entity
  id: OrganAvaliHeart
  parent: OrganHumanHeart
  categories: [ HideSpawnMenu ]
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [Avali]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic

- type: entity
  id: OrganAvaliLiver
  parent: OrganHumanLiver
  categories: [ HideSpawnMenu ]
  components:
  - type: Metabolizer
    updateInterval: 1.5
    maxReagents: 1
    metabolizerTypes: [Avali]
    groups:
    - id: Alcohol
      rateModifier: 0.1

- type: entity
  id: OrganAvaliKidneys
  parent: OrganHumanKidneys
  categories: [ HideSpawnMenu ]

- type: entity
  id: OrganAvaliLungs
  parent: OrganHumanLungs
  categories: [ HideSpawnMenu ]
