# Avali body part entities.
# Each part is referenced by ID from body_organs.yml (the body prototype).

- type: entity
  id: PartAvali
  parent: BasePart
  name: "avali body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Avali/Mobs/Species/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 1.5
      - ReagentId: UncookedAnimalProteins
        Quantity: 1.5
      - ReagentId: AmmoniaBlood
        Quantity: 5

- type: entity
  id: TorsoAvali
  name: "avali torso"
  parent: [PartAvali, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Avali/Mobs/Species/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: AvaliChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
      - ReagentId: AmmoniaBlood
        Quantity: 10

