# Avali sprite layer definitions.
# humanoidBaseSprite: one entry per visual slot, referenced by BodyPart.baseLayerId.
# speciesBaseSprites: maps slot names to the above IDs; referenced by species.yml sprites: field.

- type: humanoidBaseSprite
  id: AvaliChest
  baseSprite:
    sprite: _species/Avali/Mobs/Species/parts.rsi
    state: torso_m
  matchSkin: true

