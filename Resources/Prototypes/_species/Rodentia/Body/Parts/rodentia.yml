# Rodentia external organ entities
- type: entity
  parent: OrganBase
  id: OrganRodentia
  abstract: true
  suffix: rodentia

- type: entity
  parent: OrganRodentia
  id: OrganRodentiaExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Rodentia/Mobs/Species/Rodentia/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _species/Rodentia/Mobs/Species/Rodentia/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Rodentia

# Torso
- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganRodentiaExternal ]
  id: OrganRodentiaTorso
  components:
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special

# Head
- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganRodentiaExternal ]
  id: OrganRodentiaHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

