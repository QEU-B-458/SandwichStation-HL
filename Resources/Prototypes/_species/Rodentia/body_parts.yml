# Rodentia body part entities. Uses Rodentia-specific parts RSI.

- type: entity
  id: PartRodentia
  parent: BasePart
  name: "rodentia body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Rodentia/Mobs/Species/Rodentia/parts.rsi
  - type: StaticPrice
    price: 15
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 2
      - ReagentId: Blood
        Quantity: 8

- type: entity
  id: TorsoRodentia
  name: "rodentia torso"
  parent: [PartRodentia, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Rodentia/Mobs/Species/Rodentia/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: RodentiaChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 8
      - ReagentId: Blood
        Quantity: 15

