# Rodentia body prototype — owns the full part + organ tree.

- type: body
  id: Rodentia
  name: "rodentia"
  root: torso
  slots:
    head:
      part: HeadRodentia
      connections:
      - torso
      organs:
        brain: OrganRodentiaBrain
        eyes: OrganRodentiaEyes
        tongue: OrganRodentiaTongue
        ears: OrganRodentiaEars
    torso:
      part: TorsoRodentia
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganRodentiaHeart
        lungs: OrganRodentiaLungs
        stomach: OrganRodentiaStomach
        liver: OrganRodentiaLiver
        kidneys: OrganRodentiaKidneys
        appendix: OrganRodentiaAppendix
    right arm:
      part: RightArmRodentia
      connections:
      - right hand
    left arm:
      part: LeftArmRodentia
      connections:
      - left hand
    right hand:
      part: RightHandRodentia
    left hand:
      part: LeftHandRodentia
    right leg:
      part: RightLegRodentia
      connections:
      - right foot
    left leg:
      part: LeftLegRodentia
      connections:
      - left foot
    right foot:
      part: RightFootRodentia
    left foot:
      part: LeftFootRodentia

