# Reptilian body part entities.

- type: entity
  id: PartReptilian
  parent: BasePart
  name: "reptilian body part"
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Reptilian/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

# Sexed parts — baseLayerId set; GetSexMorph appends Male/Female at render time
- type: entity
  id: TorsoReptilian
  name: "reptilian torso"
  parent: [PartReptilian, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Reptilian/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: ReptilianChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: HeadReptilian
  name: "reptilian head"
  parent: [PartReptilian, BaseHead]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Mobs/Species/Reptilian/parts.rsi
    state: head_m
  - type: BodyPart
    baseLayerId: ReptilianHead
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

