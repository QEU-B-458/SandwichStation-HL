# Reptilian species — cold-blooded scaled humanoids
- type: species
  id: Reptilian
  name: species-name-reptilian
  roundStart: true
  prototype: MobReptilian
  defaultSkinTone: "#34a223"
  dollPrototype: AppearanceReptilian
  skinColoration: Hues
  sprites: ReptilianSprites
  maleFirstNames: NamesReptilianMale
  femaleFirstNames: NamesReptilianFemale
  naming: FirstDashFirst
  markingData:
    Torso:
      group: Reptilian
      layers:
      - Chest
      - Tail
      - Overlay
      - TailOverlay
      - UndergarmentTop
      - UndergarmentBottom
      - Special
    Head:
      group: Reptilian
      layers:
      - Head
      - Hair
      - FacialHair
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop
    ArmLeft:
      group: Reptilian
      layers: [LArm]
    ArmRight:
      group: Reptilian
      layers: [RArm]
    HandLeft:
      group: Reptilian
      layers: [LHand]
    HandRight:
      group: Reptilian
      layers: [RHand]
    LegLeft:
      group: Reptilian
      layers: [LLeg]
    LegRight:
      group: Reptilian
      layers: [RLeg]
    FootLeft:
      group: Reptilian
      layers: [LFoot]
    FootRight:
      group: Reptilian
      layers: [RFoot]

# Reptilian markings group — tail + snout required, no hair/facial hair
- type: markingsGroup
  parent: Undergarments
  id: Reptilian
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ LizardTailSmooth ]
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ LizardSnoutRound ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false
