# Feroxi body part entities.

- type: entity
  id: PartFeroxi
  parent: BasePart
  name: "feroxi body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _species/Feroxi/Mobs/Species/Feroxi/parts.rsi
  - type: StaticPrice
    price: 20
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 1.5
      - ReagentId: UncookedAnimalProteins
        Quantity: 1.5
      - ReagentId: Blood
        Quantity: 5

- type: entity
  id: TorsoFeroxi
  name: "feroxi torso"
  parent: [PartFeroxi, BaseTorso]
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _species/Feroxi/Mobs/Species/Feroxi/parts.rsi
    state: torso_m
  - type: BodyPart
    baseLayerId: FeroxiChest
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 5
      - ReagentId: UncookedAnimalProteins
        Quantity: 5
      - ReagentId: Blood
        Quantity: 10

