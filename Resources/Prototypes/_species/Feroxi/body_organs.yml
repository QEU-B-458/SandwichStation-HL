# Feroxi body prototype — owns the full part + organ tree.

- type: body
  id: Feroxi
  name: "feroxi"
  root: torso
  slots:
    head:
      part: HeadFeroxi
      connections:
      - torso
      organs:
        brain: OrganFeroxiBrain
        eyes: OrganFeroxiEyes
        tongue: OrganFeroxiTongue
        ears: OrganFeroxiEars
    torso:
      part: TorsoFeroxi
      connections:
      - right arm
      - left arm
      - right leg
      - left leg
      - head
      organs:
        heart: OrganFeroxiHeart
        lungs: OrganFeroxiLungs
        stomach: OrganFeroxiStomach
        liver: OrganFeroxiLiver
        kidneys: OrganFeroxiKidneys
        appendix: OrganFeroxiAppendix
    right arm:
      part: RightArmFeroxi
      connections:
      - right hand
    left arm:
      part: LeftArmFeroxi
      connections:
      - left hand
    right hand:
      part: RightHandFeroxi
    left hand:
      part: LeftHandFeroxi
    right leg:
      part: RightLegFeroxi
      connections:
      - right foot
    left leg:
      part: LeftLegFeroxi
      connections:
      - left foot
    right foot:
      part: RightFootFeroxi
    left foot:
      part: LeftFootFeroxi

